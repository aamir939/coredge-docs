<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F4C75"/>
      <stop offset="100%" style="stop-color:#1B6FA0"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#16213E"/>
    </linearGradient>
    <linearGradient id="bmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FDE8D0"/>
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FDEDEC"/>
      <stop offset="100%" style="stop-color:#F9E0DF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="830" fill="#FAFBFC" rx="0"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#1A1A2E">Dflare AI - Platform Architecture</text>
  <text x="700" y="58" text-anchor="middle" font-size="13" fill="#6B7280">Enterprise GPU Infrastructure Platform</text>

  <!-- ==================== LAYER 1: PORTAL ==================== -->
  <rect x="80" y="80" width="1240" height="70" rx="10" fill="url(#portalGrad)" filter="url(#shadow)"/>
  <text x="700" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Dflare AI Portal - Single Pane of Glass</text>
  <text x="700" y="132" text-anchor="middle" font-size="12" fill="#B0D4F1">Web UI  |  RESTful API  |  WebSocket  |  Role-Based Access</text>

  <!-- Connector lines: Portal to Services -->
  <line x1="240" y1="150" x2="190" y2="195" stroke="#0F4C75" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="460" y1="150" x2="430" y2="195" stroke="#0F4C75" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="670" y1="150" x2="670" y2="195" stroke="#0F4C75" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="880" y1="150" x2="910" y2="195" stroke="#0F4C75" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="1100" y1="150" x2="1180" y2="195" stroke="#0F4C75" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Section label -->
  <text x="88" y="185" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="2">ORCHESTRATION &amp; SERVICES</text>

  <!-- ==================== LAYER 2: SERVICE BOXES ==================== -->

  <!-- Identity & Access -->
  <rect x="80" y="195" width="220" height="115" rx="10" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4C75">Identity &amp; Access</text>
  <line x1="100" y1="232" x2="280" y2="232" stroke="#0F4C75" stroke-width="0.5" opacity="0.3"/>
  <text x="100" y="250" font-size="10" fill="#4B5563">OAuth2 / OIDC / JWT</text>
  <text x="100" y="265" font-size="10" fill="#4B5563">RBAC + ABAC Policies</text>
  <text x="100" y="280" font-size="10" fill="#4B5563">Per-Tenant IAM Realms</text>
  <text x="100" y="295" font-size="10" fill="#4B5563">MFA &amp; SSO Federation</text>

  <!-- Compute -->
  <rect x="320" y="195" width="220" height="115" rx="10" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4C75">Compute</text>
  <line x1="340" y1="232" x2="520" y2="232" stroke="#0F4C75" stroke-width="0.5" opacity="0.3"/>
  <text x="340" y="250" font-size="10" fill="#4B5563">Kubernetes Orchestration</text>
  <text x="340" y="265" font-size="10" fill="#4B5563">Slurm (HPC) via Operator</text>
  <text x="340" y="280" font-size="10" fill="#4B5563">Multi-Vendor GPU Operators</text>
  <text x="340" y="295" font-size="10" fill="#4B5563">Cluster Lifecycle Mgmt</text>

  <!-- Network Fabric -->
  <rect x="560" y="195" width="220" height="115" rx="10" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4C75">Network Fabric</text>
  <line x1="580" y1="232" x2="760" y2="232" stroke="#0F4C75" stroke-width="0.5" opacity="0.3"/>
  <text x="580" y="250" font-size="10" fill="#4B5563">VPC / VRF / VLAN Mgmt</text>
  <text x="580" y="265" font-size="10" fill="#4B5563">VXLAN/EVPN Overlay</text>
  <text x="580" y="280" font-size="10" fill="#4B5563">IB Partition Keys</text>
  <text x="580" y="295" font-size="10" fill="#4B5563">Perimeter Firewall ACLs</text>

  <!-- Storage -->
  <rect x="800" y="195" width="220" height="115" rx="10" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="910" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4C75">Storage</text>
  <line x1="820" y1="232" x2="1000" y2="232" stroke="#0F4C75" stroke-width="0.5" opacity="0.3"/>
  <text x="820" y="250" font-size="10" fill="#4B5563">Parallel Filesystem (IB)</text>
  <text x="820" y="265" font-size="10" fill="#4B5563">Object/File Storage (Eth)</text>
  <text x="820" y="280" font-size="10" fill="#4B5563">Per-Tenant Isolation</text>
  <text x="820" y="295" font-size="10" fill="#4B5563">Capacity Quotas</text>

  <!-- Monitoring & Billing -->
  <rect x="1040" y="195" width="280" height="115" rx="10" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1180" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4C75">Monitoring &amp; Billing</text>
  <line x1="1060" y1="232" x2="1300" y2="232" stroke="#0F4C75" stroke-width="0.5" opacity="0.3"/>
  <text x="1060" y="250" font-size="10" fill="#4B5563">HA Time-Series Metrics</text>
  <text x="1060" y="265" font-size="10" fill="#4B5563">GPU Telemetry &amp; Dashboards</text>
  <text x="1060" y="280" font-size="10" fill="#4B5563">Usage Metering Pipeline</text>
  <text x="1060" y="295" font-size="10" fill="#4B5563">Quota Mgmt &amp; Billing Reports</text>

  <!-- ==================== LAYER 3: BARE METAL PROVISIONING ==================== -->
  <!-- Connector lines: Services to BM -->
  <line x1="430" y1="310" x2="400" y2="355" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="670" y1="310" x2="670" y2="355" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="910" y1="310" x2="940" y2="355" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <text x="88" y="345" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="2">BARE METAL PROVISIONING ENGINE</text>

  <rect x="80" y="355" width="1240" height="60" rx="8" fill="url(#bmGrad)" stroke="#E67E22" stroke-width="1.5"/>
  <text x="700" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#D35400">Automated Bare Metal Provisioning</text>
  <text x="700" y="400" text-anchor="middle" font-size="11" fill="#7B5B3A">IPMI/BMC Power Control  |  PXE Network Boot  |  Golden OS Image  |  Cloud-Init Config  |  GPU Agent Registration  |  Cluster Ready</text>

  <!-- ==================== LAYER 4: GPU INFRASTRUCTURE ==================== -->
  <text x="88" y="435" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="2">GPU INFRASTRUCTURE</text>

  <rect x="80" y="445" width="1240" height="75" rx="10" fill="url(#infraGrad)" filter="url(#shadow)"/>
  <text x="700" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Bare Metal GPU Infrastructure</text>
  <text x="700" y="500" text-anchor="middle" font-size="12" fill="#8E9AAF">Multi-Vendor GPU Support (NVIDIA | AMD | Intel)   |   High-Speed InfiniBand Fabric   |   Scalable to Thousands of Nodes</text>

  <!-- Connector lines: Infra to Physical -->
  <line x1="240" y1="520" x2="190" y2="555" stroke="#4B5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="520" x2="430" y2="555" stroke="#4B5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="670" y1="520" x2="670" y2="555" stroke="#4B5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="880" y1="520" x2="910" y2="555" stroke="#4B5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="1100" y1="520" x2="1180" y2="555" stroke="#4B5563" stroke-width="1.5" opacity="0.4"/>

  <!-- ==================== LAYER 5: PHYSICAL COMPONENTS ==================== -->
  <text x="88" y="550" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="2">PHYSICAL LAYER</text>

  <!-- GPU Servers -->
  <rect x="80" y="560" width="220" height="80" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="585" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">GPU Servers</text>
  <text x="190" y="603" text-anchor="middle" font-size="10" fill="#6B7280">Multi-Vendor Platforms</text>
  <text x="190" y="618" text-anchor="middle" font-size="10" fill="#6B7280">Multiple GPUs per Node</text>
  <text x="190" y="633" text-anchor="middle" font-size="10" fill="#6B7280">BIOS &amp; OS Performance Tuned</text>

  <!-- InfiniBand Switches -->
  <rect x="320" y="560" width="220" height="80" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="585" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">InfiniBand Fabric</text>
  <text x="430" y="603" text-anchor="middle" font-size="10" fill="#6B7280">High-Speed Switches</text>
  <text x="430" y="618" text-anchor="middle" font-size="10" fill="#6B7280">RDMA / Collective Comms</text>
  <text x="430" y="633" text-anchor="middle" font-size="10" fill="#6B7280">PKey Tenant Isolation</text>

  <!-- Ethernet Fabric -->
  <rect x="560" y="560" width="220" height="80" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="585" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Ethernet Fabric</text>
  <text x="670" y="603" text-anchor="middle" font-size="10" fill="#6B7280">Mgmt &amp; Control Plane</text>
  <text x="670" y="618" text-anchor="middle" font-size="10" fill="#6B7280">VXLAN / EVPN Overlay</text>
  <text x="670" y="633" text-anchor="middle" font-size="10" fill="#6B7280">VRF per Tenant</text>

  <!-- Parallel Filesystem -->
  <rect x="800" y="560" width="220" height="80" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="910" y="585" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Parallel Filesystem</text>
  <text x="910" y="603" text-anchor="middle" font-size="10" fill="#6B7280">HPC I/O over InfiniBand</text>
  <text x="910" y="618" text-anchor="middle" font-size="10" fill="#6B7280">Striped Across OSTs</text>
  <text x="910" y="633" text-anchor="middle" font-size="10" fill="#6B7280">NodeMap Access Control</text>

  <!-- Platform Storage -->
  <rect x="1040" y="560" width="280" height="80" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1180" y="585" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Platform Storage</text>
  <text x="1180" y="603" text-anchor="middle" font-size="10" fill="#6B7280">Object / File / Block (Ethernet)</text>
  <text x="1180" y="618" text-anchor="middle" font-size="10" fill="#6B7280">Backups, Logs, Registry</text>
  <text x="1180" y="633" text-anchor="middle" font-size="10" fill="#6B7280">S3-Compatible API</text>

  <!-- ==================== SECURITY BANNER ==================== -->
  <rect x="80" y="660" width="1240" height="45" rx="8" fill="url(#secGrad)" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="700" y="687" text-anchor="middle" font-size="12" fill="#922B21">
    <tspan font-weight="700">Zero-Trust Security:</tspan>
    <tspan>  OAuth2/JWT + MFA  |  VRF/VLAN Isolation  |  IB PKey  |  Filesystem ACLs  |  K8s Namespaces  |  cgroups v2  |  mTLS  |  Audit Logs</tspan>
  </text>

  <!-- ==================== MULTI-TENANT SIDEBAR ==================== -->
  <rect x="15" y="340" width="50" height="195" rx="6" fill="#0F4C75"/>
  <text x="40" y="445" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="1" transform="rotate(-90, 40, 437)">MULTI-TENANT ISOLATION</text>

  <!-- ==================== COMPLIANCE BADGES ==================== -->
  <text x="88" y="728" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="2">COMPLIANCE</text>

  <rect x="80" y="740" width="110" height="28" rx="14" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="135" y="759" text-anchor="middle" font-size="10" font-weight="700" fill="#1ABC9C">NIST 800-53</text>

  <rect x="200" y="740" width="100" height="28" rx="14" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="250" y="759" text-anchor="middle" font-size="10" font-weight="700" fill="#1ABC9C">ISO 27001</text>

  <rect x="310" y="740" width="80" height="28" rx="14" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="350" y="759" text-anchor="middle" font-size="10" font-weight="700" fill="#1ABC9C">HIPAA</text>

  <rect x="400" y="740" width="80" height="28" rx="14" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="440" y="759" text-anchor="middle" font-size="10" font-weight="700" fill="#1ABC9C">GDPR</text>

  <rect x="490" y="740" width="120" height="28" rx="14" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
  <text x="550" y="759" text-anchor="middle" font-size="10" font-weight="700" fill="#1ABC9C">CIS Benchmarks</text>

  <!-- Footer -->
  <text x="700" y="800" text-anchor="middle" font-size="10" fill="#9CA3AF">Dflare AI  |  Enterprise GPU Infrastructure Platform</text>
</svg>
