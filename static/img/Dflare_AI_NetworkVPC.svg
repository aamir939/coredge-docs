<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0F4C75"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8E44AD"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">Network &amp; VPC — Topology &amp; Isolation Model</text>
  <text x="700" y="58" text-anchor="middle" font-size="12" fill="#6B7280">Dual-fabric architecture with hardware-enforced multi-tenant isolation</text>

  <!-- ==================== LEFT SIDE: FRONTEND FABRIC (Ethernet) ==================== -->
  <text x="88" y="90" font-size="11" font-weight="700" fill="#0F4C75" letter-spacing="1.5">FRONTEND FABRIC (ETHERNET)</text>

  <!-- Outer container -->
  <rect x="60" y="100" width="620" height="620" rx="12" fill="#F0F7FF" stroke="#0F4C75" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- Fabric Controller -->
  <rect x="80" y="115" width="580" height="55" rx="8" fill="#0F4C75" filter="url(#shadow)"/>
  <text x="370" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">🌐 Fabric Controller — VXLAN / EVPN / BGP Underlay</text>
  <text x="370" y="158" text-anchor="middle" font-size="10" fill="#B0D4F1">Programmatic VRF / VLAN / Subnet provisioning via REST API</text>

  <!-- VRF: Admin -->
  <rect x="80" y="185" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#3498DB" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="185" width="280" height="25" rx="8" fill="#3498DB"/>
  <rect x="80" y="200" width="280" height="10" fill="#3498DB"/>
  <text x="220" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Admin VRF</text>
  <text x="95" y="232" font-size="9" fill="#4B5563">VLAN: Admin/Tunnel</text>
  <text x="95" y="246" font-size="9" fill="#4B5563">VLAN: Mgmt/Frontend</text>
  <text x="95" y="260" font-size="9" fill="#4B5563">VLAN: Provider Tenant (PXE)</text>

  <!-- VRF: Provisioning -->
  <rect x="380" y="185" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#3498DB" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="380" y="185" width="280" height="25" rx="8" fill="#3498DB"/>
  <rect x="380" y="200" width="280" height="10" fill="#3498DB"/>
  <text x="520" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Provisioning VRF</text>
  <text x="395" y="232" font-size="9" fill="#4B5563">VLAN: Inband per Scalable Unit</text>
  <text x="395" y="246" font-size="9" fill="#4B5563">PXE boot + DHCP relay</text>
  <text x="395" y="260" font-size="9" fill="#4B5563">Golden OS image delivery</text>

  <!-- Tenant VRF Pool -->
  <text x="88" y="295" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">TENANT VRF POOL (CONFIGURABLE)</text>

  <!-- Tenant 1 -->
  <rect x="80" y="310" width="185" height="120" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="310" width="185" height="24" rx="8" fill="#27AE60"/>
  <rect x="80" y="326" width="185" height="8" fill="#27AE60"/>
  <text x="172" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant 1 VRF</text>
  <text x="95" y="355" font-size="9" fill="#4B5563">📍 CP / Login VLAN</text>
  <text x="95" y="370" font-size="9" fill="#4B5563">📍 GPU Workers VLAN</text>
  <text x="95" y="385" font-size="9" fill="#4B5563">📍 Load Balancer VLAN</text>
  <text x="95" y="400" font-size="9" fill="#4B5563">📍 Additional VLAN</text>
  <text x="95" y="420" font-size="8" fill="#27AE60" font-weight="600">ISOLATED ROUTING TABLE</text>

  <!-- Tenant 2 -->
  <rect x="278" y="310" width="185" height="120" rx="8" fill="#FFFFFF" stroke="#2980B9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="278" y="310" width="185" height="24" rx="8" fill="#2980B9"/>
  <rect x="278" y="326" width="185" height="8" fill="#2980B9"/>
  <text x="370" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant 2 VRF</text>
  <text x="293" y="355" font-size="9" fill="#4B5563">📍 CP / Login VLAN</text>
  <text x="293" y="370" font-size="9" fill="#4B5563">📍 GPU Workers VLAN</text>
  <text x="293" y="385" font-size="9" fill="#4B5563">📍 Load Balancer VLAN</text>
  <text x="293" y="400" font-size="9" fill="#4B5563">📍 Additional VLAN</text>
  <text x="293" y="420" font-size="8" fill="#2980B9" font-weight="600">ISOLATED ROUTING TABLE</text>

  <!-- Tenant N -->
  <rect x="476" y="310" width="185" height="120" rx="8" fill="#FFFFFF" stroke="#8E44AD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="476" y="310" width="185" height="24" rx="8" fill="#8E44AD"/>
  <rect x="476" y="326" width="185" height="8" fill="#8E44AD"/>
  <text x="568" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant N VRF</text>
  <text x="491" y="355" font-size="9" fill="#4B5563">📍 CP / Login VLAN</text>
  <text x="491" y="370" font-size="9" fill="#4B5563">📍 GPU Workers VLAN</text>
  <text x="491" y="385" font-size="9" fill="#4B5563">📍 Load Balancer VLAN</text>
  <text x="491" y="400" font-size="9" fill="#4B5563">📍 Additional VLAN</text>
  <text x="491" y="420" font-size="8" fill="#8E44AD" font-weight="600">ISOLATED ROUTING TABLE</text>

  <!-- Outside Infra VRF -->
  <rect x="80" y="450" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#95A5A6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="450" width="280" height="22" rx="8" fill="#95A5A6"/>
  <rect x="80" y="465" width="280" height="7" fill="#95A5A6"/>
  <text x="220" y="467" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Outside Infra VRF</text>
  <text x="95" y="492" font-size="9" fill="#4B5563">DNS • NTP • Syslog • LDAP/AD • Shared Services</text>

  <!-- Perimeter Firewall -->
  <rect x="380" y="450" width="280" height="60" rx="8" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="477" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">🛡️ Perimeter Firewall</text>
  <text x="520" y="497" text-anchor="middle" font-size="9" fill="#922B21">Stateful • Per-tenant ACLs • L3 Out</text>

  <!-- Leaf/Spine -->
  <rect x="80" y="530" width="580" height="50" rx="8" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="370" y="555" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Leaf &amp; Spine Switches — VXLAN/EVPN Fabric</text>
  <text x="370" y="572" text-anchor="middle" font-size="10" fill="#95A5A6">Physical switch port config per GPU node • SVI gateways • ACLs</text>

  <!-- GPU Nodes (FE) -->
  <rect x="80" y="600" width="580" height="50" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="370" y="623" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">🖥️ GPU Nodes — Ethernet NICs (Management + Tenant Traffic)</text>
  <text x="370" y="640" text-anchor="middle" font-size="10" fill="#6B7280">Each node's port assigned to tenant VLAN • CNI overlay for pod networking</text>

  <!-- Connections FE side -->
  <line x1="370" y1="580" x2="370" y2="600" stroke="#4B5563" stroke-width="1.5"/>

  <!-- ==================== RIGHT SIDE: BACKEND FABRIC (InfiniBand) ==================== -->
  <text x="718" y="90" font-size="11" font-weight="700" fill="#8E44AD" letter-spacing="1.5">BACKEND FABRIC (INFINIBAND)</text>

  <!-- Outer container -->
  <rect x="700" y="100" width="640" height="620" rx="12" fill="#FAF0FF" stroke="#8E44AD" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- IB Fabric Manager -->
  <rect x="720" y="115" width="600" height="55" rx="8" fill="#8E44AD" filter="url(#shadow)"/>
  <text x="1020" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">⚡ IB Fabric Manager — Partition Key Management</text>
  <text x="1020" y="158" text-anchor="middle" font-size="10" fill="#D7BDE2">Routing, telemetry, per-tenant PKey isolation at switch hardware level</text>

  <!-- PKey Pool -->
  <text x="728" y="195" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">PARTITION KEY (PKEY) ISOLATION</text>

  <!-- Tenant 1 PKey -->
  <rect x="720" y="210" width="185" height="100" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="720" y="210" width="185" height="24" rx="8" fill="#27AE60"/>
  <rect x="720" y="226" width="185" height="8" fill="#27AE60"/>
  <text x="812" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant 1 PKey</text>
  <text x="735" y="255" font-size="9" fill="#4B5563">GPU HCA GUIDs: Tenant 1</text>
  <text x="735" y="270" font-size="9" fill="#4B5563">RDMA / Collective Comms</text>
  <text x="735" y="285" font-size="9" fill="#4B5563">GPU ↔ GPU (training)</text>
  <text x="735" y="300" font-size="8" fill="#27AE60" font-weight="600">HW-ENFORCED ISOLATION</text>

  <!-- Tenant 2 PKey -->
  <rect x="918" y="210" width="185" height="100" rx="8" fill="#FFFFFF" stroke="#2980B9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="918" y="210" width="185" height="24" rx="8" fill="#2980B9"/>
  <rect x="918" y="226" width="185" height="8" fill="#2980B9"/>
  <text x="1010" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant 2 PKey</text>
  <text x="933" y="255" font-size="9" fill="#4B5563">GPU HCA GUIDs: Tenant 2</text>
  <text x="933" y="270" font-size="9" fill="#4B5563">RDMA / Collective Comms</text>
  <text x="933" y="285" font-size="9" fill="#4B5563">GPU ↔ GPU (training)</text>
  <text x="933" y="300" font-size="8" fill="#2980B9" font-weight="600">HW-ENFORCED ISOLATION</text>

  <!-- Tenant N PKey -->
  <rect x="1116" y="210" width="185" height="100" rx="8" fill="#FFFFFF" stroke="#8E44AD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1116" y="210" width="185" height="24" rx="8" fill="#8E44AD"/>
  <rect x="1116" y="226" width="185" height="8" fill="#8E44AD"/>
  <text x="1208" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant N PKey</text>
  <text x="1131" y="255" font-size="9" fill="#4B5563">GPU HCA GUIDs: Tenant N</text>
  <text x="1131" y="270" font-size="9" fill="#4B5563">RDMA / Collective Comms</text>
  <text x="1131" y="285" font-size="9" fill="#4B5563">GPU ↔ GPU (training)</text>
  <text x="1131" y="300" font-size="8" fill="#8E44AD" font-weight="600">HW-ENFORCED ISOLATION</text>

  <!-- Storage Access (IB side) -->
  <text x="728" y="335" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">STORAGE ACCESS (INFINIBAND)</text>

  <rect x="720" y="350" width="600" height="80" rx="8" fill="#FFFFFF" stroke="#E67E22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1020" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#D35400">📁 Parallel Filesystem — Double Isolation</text>
  <text x="1020" y="400" text-anchor="middle" font-size="10" fill="#4B5563">Layer 1: IB Partition Key — only tenant GPU ports on tenant's partition</text>
  <text x="1020" y="416" text-anchor="middle" font-size="10" fill="#4B5563">Layer 2: Access Control Map — only tenant IB IPs can mount tenant directory</text>

  <!-- IB Switches -->
  <rect x="720" y="450" width="600" height="50" rx="8" fill="#4A235A" filter="url(#shadow)"/>
  <text x="1020" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">InfiniBand Switches — High-Speed Fabric</text>
  <text x="1020" y="492" text-anchor="middle" font-size="10" fill="#C39BD3">Multiple high-bandwidth links per node • RDMA • Low latency</text>

  <!-- GPU Nodes (IB) -->
  <rect x="720" y="520" width="600" height="50" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1020" y="543" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">⚡ GPU Nodes — InfiniBand HCAs (Training + Storage Traffic)</text>
  <text x="1020" y="560" text-anchor="middle" font-size="10" fill="#6B7280">GPU-to-GPU RDMA • GPU-to-Storage parallel I/O • PKey enforced</text>

  <!-- Connection IB side -->
  <line x1="1020" y1="500" x2="1020" y2="520" stroke="#4A235A" stroke-width="1.5"/>

  <!-- ==================== BOTTOM: TRAFFIC FLOW LEGEND ==================== -->
  <text x="728" y="600" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">TRAFFIC FLOW SUMMARY</text>

  <rect x="720" y="612" width="600" height="100" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Legend items -->
  <rect x="740" y="625" width="12" height="12" rx="2" fill="#8E44AD"/>
  <text x="760" y="636" font-size="10" fill="#4B5563"><tspan font-weight="600">GPU ↔ GPU (Training):</tspan> InfiniBand backend • RDMA / Collective Comms • PKey isolated</text>

  <rect x="740" y="648" width="12" height="12" rx="2" fill="#E67E22"/>
  <text x="760" y="659" font-size="10" fill="#4B5563"><tspan font-weight="600">GPU ↔ Storage:</tspan> InfiniBand → Parallel Filesystem • RDMA • Access Control Map</text>

  <rect x="740" y="671" width="12" height="12" rx="2" fill="#0F4C75"/>
  <text x="760" y="682" font-size="10" fill="#4B5563"><tspan font-weight="600">Pod ↔ Pod:</tspan> Ethernet tenant VLAN • CNI overlay (BGP / eBPF) • VRF isolated</text>

  <rect x="740" y="694" width="12" height="12" rx="2" fill="#E74C3C"/>
  <text x="760" y="705" font-size="10" fill="#4B5563"><tspan font-weight="600">External Access:</tspan> Tenant LB VLAN → Ingress → Perimeter Firewall → Internet</text>

  <!-- Footer -->
  <text x="700" y="770" text-anchor="middle" font-size="10" fill="#9CA3AF">© Dflare AI  •  Network &amp; VPC Topology  •  Confidential</text>
</svg>
