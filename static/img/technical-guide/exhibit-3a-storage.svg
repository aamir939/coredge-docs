<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="volumeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">STORAGE ARCHITECTURE — DUAL-TIER</text>

  <!-- Main Container -->
  <rect x="40" y="55" width="720" height="300" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- GPU Nodes -->
  <rect x="80" y="80" width="100" height="50" rx="6" fill="url(#gpuGrad)"/>
  <text x="130" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">GPU 1</text>

  <rect x="200" y="80" width="100" height="50" rx="6" fill="url(#gpuGrad)"/>
  <text x="250" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">GPU 2</text>

  <rect x="320" y="80" width="100" height="50" rx="6" fill="url(#gpuGrad)"/>
  <text x="370" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">GPU N</text>

  <!-- Arrows from GPUs -->
  <line x1="130" y1="130" x2="130" y2="160" stroke="#6B7280" stroke-width="2"/>
  <line x1="250" y1="130" x2="250" y2="160" stroke="#6B7280" stroke-width="2"/>
  <line x1="370" y1="130" x2="370" y2="160" stroke="#6B7280" stroke-width="2"/>

  <!-- High-Performance Tier -->
  <rect x="60" y="160" width="480" height="70" rx="8" fill="url(#hpGrad)"/>
  <text x="300" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">High-Performance Tier (InfiniBand RDMA)</text>
  <text x="300" y="210" text-anchor="middle" font-size="10" fill="#FEF3C7">Parallel File System | Data Striping | Low Latency</text>

  <!-- Arrow -->
  <line x1="300" y1="230" x2="300" y2="250" stroke="#6B7280" stroke-width="2"/>

  <!-- Platform Tier -->
  <rect x="60" y="250" width="480" height="70" rx="8" fill="url(#platformGrad)"/>
  <text x="300" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Platform Tier (Ethernet)</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#B0D4F1">Object &amp; File Storage | Backups | Control Plane State</text>

  <!-- Volume Service -->
  <rect x="580" y="200" width="140" height="60" rx="8" fill="url(#volumeGrad)"/>
  <text x="650" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Volume Service</text>

  <!-- Connection lines from Volume Service -->
  <line x1="580" y1="215" x2="540" y2="195" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="580" y1="245" x2="540" y2="285" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Footer -->
  <text x="400" y="390" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Exhibit 3a: Storage architecture — dual-tier design with RDMA-enabled high-performance path.</text>
</svg>
