<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="scaleHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="gpuScale" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="netScale" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="storScale" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cpScale" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">PRODUCTION SCALE DIMENSIONS</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6B7280">Horizontal Scaling Without Architectural Bottlenecks</text>

  <!-- Main Container -->
  <rect x="40" y="70" width="820" height="340" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Column Headers -->
  <rect x="60" y="90" width="200" height="40" rx="8" fill="url(#scaleHeader)"/>
  <text x="160" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Dimension</text>

  <rect x="280" y="90" width="200" height="40" rx="8" fill="url(#scaleHeader)"/>
  <text x="380" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Capacity</text>

  <rect x="500" y="90" width="340" height="40" rx="8" fill="url(#scaleHeader)"/>
  <text x="670" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Scaling Mechanism</text>

  <!-- Row 1: GPU Nodes -->
  <rect x="60" y="145" width="200" height="55" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="160" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">GPU Nodes</text>

  <rect x="280" y="145" width="200" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="380" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#10B981">0 to 10,000+</text>
  <text x="380" y="188" text-anchor="middle" font-size="10" fill="#6B7280">nodes</text>

  <rect x="500" y="145" width="340" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="670" y="170" text-anchor="middle" font-size="11" fill="#4B5563">Add nodes linearly —</text>
  <text x="670" y="186" text-anchor="middle" font-size="11" fill="#4B5563">no control plane bottleneck</text>

  <!-- Row 2: Network Bandwidth -->
  <rect x="60" y="215" width="200" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF">Network Bandwidth</text>

  <rect x="280" y="215" width="200" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="380" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#3B82F6">400 GB/s</text>
  <text x="380" y="258" text-anchor="middle" font-size="10" fill="#6B7280">per-node</text>

  <rect x="500" y="215" width="340" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="670" y="240" text-anchor="middle" font-size="11" fill="#4B5563">Leaf-spine expands with</text>
  <text x="670" y="256" text-anchor="middle" font-size="11" fill="#4B5563">additional spine switches</text>

  <!-- Row 3: Storage Throughput -->
  <rect x="60" y="285" width="200" height="55" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="160" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">Storage Throughput</text>

  <rect x="280" y="285" width="200" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="380" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#F59E0B">100 GB/s</text>
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#6B7280">aggregate</text>

  <rect x="500" y="285" width="340" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="670" y="310" text-anchor="middle" font-size="11" fill="#4B5563">Add storage nodes to increase</text>
  <text x="670" y="326" text-anchor="middle" font-size="11" fill="#4B5563">throughput and capacity</text>

  <!-- Row 4: Control Plane -->
  <rect x="60" y="355" width="200" height="55" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="160" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#6D28D9">Control Plane</text>

  <rect x="280" y="355" width="200" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="380" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#8B5CF6">10,000+</text>
  <text x="380" y="398" text-anchor="middle" font-size="10" fill="#6B7280">nodes supported</text>

  <rect x="500" y="355" width="340" height="55" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="670" y="380" text-anchor="middle" font-size="11" fill="#4B5563">Proven scheduler managing</text>
  <text x="670" y="396" text-anchor="middle" font-size="11" fill="#4B5563">large-scale GPU clusters</text>

  <!-- Footer -->
  <text x="450" y="435" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Exhibit 11: Production scale dimensions — horizontal scaling at every layer.</text>
</svg>
