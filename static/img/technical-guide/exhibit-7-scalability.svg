<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="nodeGradS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">SCALABILITY MODEL — LEAF-SPINE ARCHITECTURE</text>

  <!-- Main Container -->
  <rect x="40" y="55" width="820" height="280" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Spine Layer -->
  <rect x="230" y="75" width="130" height="45" rx="8" fill="url(#spineGrad)"/>
  <text x="295" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Spine 1</text>

  <rect x="385" y="75" width="130" height="45" rx="8" fill="url(#spineGrad)"/>
  <text x="450" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Spine 2</text>

  <rect x="540" y="75" width="130" height="45" rx="8" fill="url(#spineGrad)"/>
  <text x="605" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Spine 3</text>

  <text x="750" y="100" font-size="10" fill="#6B7280">Spine Layer</text>

  <!-- Leaf Layer -->
  <rect x="70" y="160" width="110" height="45" rx="8" fill="url(#leafGrad)"/>
  <text x="125" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Leaf 1</text>

  <rect x="200" y="160" width="110" height="45" rx="8" fill="url(#leafGrad)"/>
  <text x="255" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Leaf 2</text>

  <rect x="330" y="160" width="110" height="45" rx="8" fill="url(#leafGrad)"/>
  <text x="385" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Leaf 3</text>

  <rect x="460" y="160" width="110" height="45" rx="8" fill="url(#leafGrad)"/>
  <text x="515" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Leaf 4</text>

  <rect x="590" y="160" width="110" height="45" rx="8" fill="url(#leafGrad)"/>
  <text x="645" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Leaf 5</text>

  <text x="750" y="185" font-size="10" fill="#6B7280">Leaf Layer</text>

  <!-- Connection lines (Spine to Leaf) -->
  <line x1="295" y1="120" x2="125" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="295" y1="120" x2="255" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="295" y1="120" x2="385" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="120" x2="255" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="120" x2="385" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="120" x2="515" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="605" y1="120" x2="385" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="605" y1="120" x2="515" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="605" y1="120" x2="645" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>

  <!-- Node Layer -->
  <rect x="70" y="250" width="80" height="40" rx="6" fill="url(#nodeGradS)"/>
  <text x="110" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">GPU 1</text>

  <rect x="165" y="250" width="80" height="40" rx="6" fill="url(#nodeGradS)"/>
  <text x="205" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">GPU 2</text>

  <rect x="260" y="250" width="80" height="40" rx="6" fill="url(#nodeGradS)"/>
  <text x="300" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">GPU 3</text>

  <rect x="355" y="250" width="80" height="40" rx="6" fill="url(#nodeGradS)"/>
  <text x="395" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">GPU 4</text>

  <rect x="450" y="250" width="80" height="40" rx="6" fill="url(#nodeGradS)"/>
  <text x="490" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">GPU 5</text>

  <rect x="545" y="250" width="80" height="40" rx="6" fill="url(#nodeGradS)"/>
  <text x="585" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">GPU 6</text>

  <rect x="640" y="250" width="80" height="40" rx="6" fill="#8B5CF6"/>
  <text x="680" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">Storage</text>

  <text x="750" y="272" font-size="10" fill="#6B7280">Node Layer</text>

  <!-- Connection lines (Leaf to Node) -->
  <line x1="125" y1="205" x2="110" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="205" x2="205" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="255" y1="205" x2="205" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="255" y1="205" x2="300" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="385" y1="205" x2="300" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="385" y1="205" x2="395" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="205" x2="395" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="205" x2="490" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="645" y1="205" x2="585" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="645" y1="205" x2="680" y2="250" stroke="#6B7280" stroke-width="1" opacity="0.5"/>

  <!-- Footer -->
  <text x="450" y="370" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Exhibit 7: Leaf-spine network topology enabling horizontal scalability.</text>
</svg>
