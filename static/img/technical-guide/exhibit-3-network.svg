<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="ibGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">DUAL-FABRIC NETWORK ARCHITECTURE</text>

  <!-- Main Container -->
  <rect x="40" y="55" width="820" height="400" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Ethernet Section -->
  <rect x="60" y="75" width="380" height="250" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="80" y="100" font-size="14" font-weight="700" fill="#1E40AF">ETHERNET (Frontend)</text>

  <rect x="80" y="115" width="340" height="35" rx="6" fill="url(#ethGrad)"/>
  <text x="250" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">VXLAN / EVPN / BGP</text>

  <rect x="80" y="165" width="160" height="50" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="160" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Admin VRF</text>

  <rect x="260" y="165" width="160" height="50" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="340" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Provisioning VRF</text>

  <rect x="80" y="230" width="160" height="50" rx="6" fill="#3B82F6"/>
  <text x="160" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Tenant VRF 1</text>

  <rect x="260" y="230" width="160" height="50" rx="6" fill="#3B82F6"/>
  <text x="340" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Tenant VRF N</text>

  <!-- InfiniBand Section -->
  <rect x="460" y="75" width="380" height="250" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="480" y="100" font-size="14" font-weight="700" fill="#92400E">INFINIBAND (Backend)</text>

  <rect x="480" y="115" width="340" height="35" rx="6" fill="url(#ibGrad)"/>
  <text x="650" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">High-Bandwidth Multi-Link</text>

  <rect x="480" y="165" width="160" height="50" rx="6" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
  <text x="560" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">IB Fabric Manager</text>

  <rect x="660" y="165" width="160" height="50" rx="6" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
  <text x="740" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">PKey Isolation</text>

  <rect x="480" y="230" width="160" height="50" rx="6" fill="#F59E0B"/>
  <text x="560" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">GPU-to-GPU</text>
  <text x="560" y="268" text-anchor="middle" font-size="9" fill="#FFFFFF">(RDMA)</text>

  <rect x="660" y="230" width="160" height="50" rx="6" fill="#F59E0B"/>
  <text x="740" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">GPU-to-Storage</text>

  <!-- Bottom Nodes -->
  <rect x="80" y="350" width="130" height="50" rx="6" fill="url(#nodeGrad)"/>
  <text x="145" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">GPU Node 1</text>

  <rect x="230" y="350" width="130" height="50" rx="6" fill="url(#nodeGrad)"/>
  <text x="295" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">GPU Node 2</text>

  <rect x="380" y="350" width="130" height="50" rx="6" fill="url(#nodeGrad)"/>
  <text x="445" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">GPU Node N</text>

  <rect x="560" y="350" width="130" height="50" rx="6" fill="#8B5CF6"/>
  <text x="625" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Parallel FS</text>

  <rect x="710" y="350" width="130" height="50" rx="6" fill="#8B5CF6"/>
  <text x="775" y="380" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Object Store</text>

  <!-- Connection lines -->
  <line x1="145" y1="290" x2="145" y2="350" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="295" y1="290" x2="295" y2="350" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="445" y1="320" x2="445" y2="350" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="560" y1="280" x2="625" y2="350" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="740" y1="280" x2="775" y2="350" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Footer -->
  <text x="450" y="485" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Exhibit 3: Dual-fabric network architecture with hardware-enforced tenant isolation.</text>
</svg>
