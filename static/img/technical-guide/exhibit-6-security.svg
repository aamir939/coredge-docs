<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="layer1G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2C5282"/>
    </linearGradient>
    <linearGradient id="layer2G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4A7C"/>
      <stop offset="100%" stop-color="#3B6098"/>
    </linearGradient>
    <linearGradient id="layer3G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B6098"/>
      <stop offset="100%" stop-color="#4A78B0"/>
    </linearGradient>
    <linearGradient id="layer4G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A8AC8"/>
      <stop offset="100%" stop-color="#6B9DD8"/>
    </linearGradient>
    <linearGradient id="layer5G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BB0E8"/>
      <stop offset="100%" stop-color="#8FC3F5"/>
    </linearGradient>
    <linearGradient id="coreG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">DEFENSE-IN-DEPTH SECURITY MODEL</text>

  <!-- Concentric Circles Container -->
  <rect x="40" y="55" width="480" height="350" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Layer circles (concentric) -->
  <ellipse cx="280" cy="230" rx="210" ry="150" fill="url(#layer1G)"/>
  <ellipse cx="280" cy="230" rx="175" ry="125" fill="url(#layer2G)"/>
  <ellipse cx="280" cy="230" rx="140" ry="100" fill="url(#layer3G)"/>
  <ellipse cx="280" cy="230" rx="105" ry="75" fill="url(#layer4G)"/>
  <ellipse cx="280" cy="230" rx="70" ry="50" fill="url(#layer5G)"/>
  <ellipse cx="280" cy="230" rx="40" ry="30" fill="url(#coreG)"/>

  <!-- Core Text -->
  <text x="280" y="225" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">ZERO</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">TRUST</text>

  <!-- Legend -->
  <rect x="540" y="55" width="220" height="350" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <rect x="560" y="80" width="20" height="20" rx="4" fill="url(#layer1G)"/>
  <text x="590" y="95" font-size="10" fill="#4B5563">Perimeter Firewall + ACLs</text>

  <rect x="560" y="115" width="20" height="20" rx="4" fill="url(#layer2G)"/>
  <text x="590" y="130" font-size="10" fill="#4B5563">Network: VRF + VLAN + IB PKey</text>

  <rect x="560" y="150" width="20" height="20" rx="4" fill="url(#layer3G)"/>
  <text x="590" y="165" font-size="10" fill="#4B5563">Transport: TLS 1.2+ / mTLS</text>

  <rect x="560" y="185" width="20" height="20" rx="4" fill="url(#layer4G)"/>
  <text x="590" y="200" font-size="10" fill="#4B5563">Auth: OAuth2 / RBAC + ABAC</text>

  <rect x="560" y="220" width="20" height="20" rx="4" fill="url(#layer5G)"/>
  <text x="590" y="235" font-size="10" fill="#4B5563">Compute: Namespaces / cgroups</text>

  <rect x="560" y="255" width="20" height="20" rx="4" fill="url(#coreG)"/>
  <text x="590" y="270" font-size="10" fill="#4B5563">Audit: Immutable Logs</text>

  <!-- Compliance Box -->
  <rect x="560" y="310" width="180" height="70" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
  <text x="650" y="335" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">COMPLIANCE ALIGNMENT</text>
  <text x="650" y="360" text-anchor="middle" font-size="9" fill="#047857">NIST 800-53 | ISO 27001 | HIPAA</text>

  <!-- Footer -->
  <text x="400" y="450" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Exhibit 6: Concentric defense-in-depth security model.</text>
</svg>
