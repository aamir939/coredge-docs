<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="spineDep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="torDep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ibDep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gpuDep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">DEPLOYMENT ARCHITECTURE — RACK TOPOLOGY</text>

  <!-- Main Container -->
  <rect x="40" y="55" width="720" height="330" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Spine Switches -->
  <rect x="260" y="75" width="130" height="45" rx="8" fill="url(#spineDep)"/>
  <text x="325" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Spine 1</text>

  <rect x="410" y="75" width="130" height="45" rx="8" fill="url(#spineDep)"/>
  <text x="475" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Spine 2</text>

  <!-- ToR Switches -->
  <rect x="80" y="160" width="130" height="45" rx="8" fill="url(#torDep)"/>
  <text x="145" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">ToR Eth</text>

  <rect x="335" y="160" width="130" height="45" rx="8" fill="url(#torDep)"/>
  <text x="400" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">ToR Eth</text>

  <rect x="590" y="160" width="130" height="45" rx="8" fill="url(#torDep)"/>
  <text x="655" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">ToR Eth</text>

  <!-- IB Switch -->
  <rect x="300" y="235" width="200" height="40" rx="8" fill="url(#ibDep)"/>
  <text x="400" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">IB Switch</text>

  <!-- Connection lines (Spine to ToR) -->
  <line x1="325" y1="120" x2="145" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="325" y1="120" x2="400" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="475" y1="120" x2="400" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>
  <line x1="475" y1="120" x2="655" y2="160" stroke="#6B7280" stroke-width="1" opacity="0.5"/>

  <!-- GPU Nodes Label -->
  <text x="60" y="305" font-size="10" fill="#6B7280">GPU Nodes</text>

  <!-- GPU Nodes Row 1 -->
  <rect x="80" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="110" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="110" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">1</text>

  <rect x="150" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="180" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="180" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">2</text>

  <rect x="220" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="250" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="250" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">3</text>

  <rect x="290" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="320" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="320" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">4</text>

  <rect x="360" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="390" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="390" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">5</text>

  <rect x="430" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="460" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="460" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">6</text>

  <rect x="500" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="530" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="530" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">7</text>

  <rect x="570" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="600" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="600" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">8</text>

  <rect x="640" y="315" width="60" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="670" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="670" y="350" text-anchor="middle" font-size="8" font-weight="600" fill="#FFFFFF">9</text>

  <rect x="710" y="315" width="40" height="40" rx="6" fill="url(#gpuDep)"/>
  <text x="730" y="340" text-anchor="middle" font-size="7" font-weight="600" fill="#FFFFFF">GPU</text>
  <text x="730" y="350" text-anchor="middle" font-size="7" font-weight="600" fill="#FFFFFF">10</text>

  <!-- Legend -->
  <text x="80" y="380" font-size="9" font-weight="600" fill="#6B7280">Legend:</text>
  <rect x="135" y="370" width="15" height="15" rx="3" fill="url(#torDep)"/>
  <text x="160" y="382" font-size="9" fill="#4B5563">Ethernet ToR</text>
  <rect x="255" y="370" width="15" height="15" rx="3" fill="url(#ibDep)"/>
  <text x="280" y="382" font-size="9" fill="#4B5563">InfiniBand</text>
  <rect x="365" y="370" width="15" height="15" rx="3" fill="url(#gpuDep)"/>
  <text x="390" y="382" font-size="9" fill="#4B5563">GPU Node</text>

  <!-- Footer -->
  <text x="400" y="420" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Exhibit 9: Rack-level deployment topology with dual-fabric architecture.</text>
</svg>
