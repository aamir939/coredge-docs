<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="#FAFBFC"/>

  <!-- Outer container -->
  <rect x="20" y="15" width="760" height="440" rx="12" fill="#F0F7FF" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="20" y="15" width="760" height="45" rx="12" fill="#0F4C75"/>
  <rect x="20" y="45" width="760" height="15" fill="#0F4C75"/>
  <text x="400" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Frontend Fabric (Ethernet)</text>

  <!-- Fabric Controller -->
  <rect x="40" y="75" width="720" height="45" rx="8" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="400" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Fabric Controller — VXLAN / EVPN / BGP Underlay</text>
  <text x="400" y="112" text-anchor="middle" font-size="9" fill="#95A5A6">Programmatic VRF / VLAN / Subnet provisioning via REST API</text>

  <!-- Admin VRF -->
  <rect x="40" y="135" width="350" height="70" rx="8" fill="#FFFFFF" stroke="#3498DB" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="135" width="350" height="22" rx="8" fill="#3498DB"/>
  <rect x="40" y="150" width="350" height="7" fill="#3498DB"/>
  <text x="215" y="151" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Admin VRF</text>
  <text x="55" y="175" font-size="9" fill="#4B5563">VLAN: Admin/Tunnel • Mgmt/Frontend • Provider Tenant</text>
  <text x="55" y="190" font-size="8" fill="#6B7280">Platform ops, portal, bare metal controller</text>

  <!-- Provisioning VRF -->
  <rect x="410" y="135" width="350" height="70" rx="8" fill="#FFFFFF" stroke="#3498DB" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="135" width="350" height="22" rx="8" fill="#3498DB"/>
  <rect x="410" y="150" width="350" height="7" fill="#3498DB"/>
  <text x="585" y="151" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Provisioning VRF</text>
  <text x="425" y="175" font-size="9" fill="#4B5563">VLAN: Inband per Scalable Unit • PXE boot</text>
  <text x="425" y="190" font-size="8" fill="#6B7280">Golden OS image delivery • DHCP relay</text>

  <!-- Tenant VRF Pool Label -->
  <text x="48" y="225" font-size="9" font-weight="700" fill="#9CA3AF" letter-spacing="1.2">TENANT VRF POOL (CONFIGURABLE)</text>

  <!-- Tenant 1 -->
  <rect x="40" y="238" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="238" width="230" height="22" rx="8" fill="#27AE60"/>
  <rect x="40" y="253" width="230" height="7" fill="#27AE60"/>
  <text x="155" y="254" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant 1 VRF</text>
  <text x="55" y="275" font-size="9" fill="#4B5563">CP / Login VLAN</text>
  <text x="55" y="289" font-size="9" fill="#4B5563">GPU Workers VLAN</text>
  <text x="55" y="303" font-size="9" fill="#4B5563">Load Balancer VLAN</text>
  <text x="55" y="318" font-size="8" fill="#27AE60" font-weight="600">ISOLATED ROUTING</text>

  <!-- Tenant 2 -->
  <rect x="285" y="238" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#2980B9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="285" y="238" width="230" height="22" rx="8" fill="#2980B9"/>
  <rect x="285" y="253" width="230" height="7" fill="#2980B9"/>
  <text x="400" y="254" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant 2 VRF</text>
  <text x="300" y="275" font-size="9" fill="#4B5563">CP / Login VLAN</text>
  <text x="300" y="289" font-size="9" fill="#4B5563">GPU Workers VLAN</text>
  <text x="300" y="303" font-size="9" fill="#4B5563">Load Balancer VLAN</text>
  <text x="300" y="318" font-size="8" fill="#2980B9" font-weight="600">ISOLATED ROUTING</text>

  <!-- Tenant N -->
  <rect x="530" y="238" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#8E44AD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="530" y="238" width="230" height="22" rx="8" fill="#8E44AD"/>
  <rect x="530" y="253" width="230" height="7" fill="#8E44AD"/>
  <text x="645" y="254" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant N VRF</text>
  <text x="545" y="275" font-size="9" fill="#4B5563">CP / Login VLAN</text>
  <text x="545" y="289" font-size="9" fill="#4B5563">GPU Workers VLAN</text>
  <text x="545" y="303" font-size="9" fill="#4B5563">Load Balancer VLAN</text>
  <text x="545" y="318" font-size="8" fill="#8E44AD" font-weight="600">ISOLATED ROUTING</text>

  <!-- Outside Infra VRF -->
  <rect x="40" y="338" width="350" height="42" rx="8" fill="#FFFFFF" stroke="#95A5A6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="338" width="350" height="18" rx="8" fill="#95A5A6"/>
  <rect x="40" y="350" width="350" height="6" fill="#95A5A6"/>
  <text x="215" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Outside Infra VRF</text>
  <text x="55" y="372" font-size="9" fill="#4B5563">DNS • NTP • Syslog • LDAP/AD • Shared Services</text>

  <!-- Perimeter Firewall -->
  <rect x="410" y="338" width="350" height="42" rx="8" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#C0392B">Perimeter Firewall</text>
  <text x="585" y="372" text-anchor="middle" font-size="9" fill="#922B21">Stateful • Per-tenant ACLs • L3 Out</text>

  <!-- Leaf/Spine -->
  <rect x="40" y="388" width="720" height="30" rx="8" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="400" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Leaf &amp; Spine Switches — VXLAN/EVPN Fabric</text>

  <!-- GPU Nodes -->
  <rect x="40" y="425" width="720" height="25" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="400" y="442" text-anchor="middle" font-size="9" font-weight="600" fill="#1F2937">GPU Nodes — Ethernet NICs (Management + Tenant Traffic)</text>

  <!-- Footer -->
  <text x="400" y="468" text-anchor="middle" font-size="8" fill="#9CA3AF">Dflare AI • Frontend Fabric Architecture</text>
</svg>
