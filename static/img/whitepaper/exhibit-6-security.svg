<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <!-- Professional Blue Color Scheme - Outer to Inner -->
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2C5282"/>
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4A7C"/>
      <stop offset="100%" stop-color="#3B6098"/>
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B6098"/>
      <stop offset="100%" stop-color="#4A78B0"/>
    </linearGradient>
    <linearGradient id="layer4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A8AC8"/>
      <stop offset="100%" stop-color="#6B9DD8"/>
    </linearGradient>
    <linearGradient id="layer5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BB0E8"/>
      <stop offset="100%" stop-color="#8FC3F5"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">Defense-in-Depth Security Model</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6B7280">Concentric Security Layers — Zero Trust Architecture</text>

  <!-- Layer 1: Perimeter (Outermost) -->
  <rect x="50" y="80" width="700" height="380" rx="20" fill="url(#layer1Grad)" stroke="#1E3A5F" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">PERIMETER</text>
  <text x="400" y="128" text-anchor="middle" font-size="10" fill="#A5C4E8">Firewall + ACLs + Edge Protection</text>

  <!-- Layer 2: Network -->
  <rect x="80" y="145" width="640" height="295" rx="18" fill="url(#layer2Grad)" stroke="#2B4A7C" stroke-width="2"/>
  <text x="400" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">NETWORK</text>
  <text x="400" y="188" text-anchor="middle" font-size="10" fill="#B8D4F0">VRF + VLAN + InfiniBand Partition Key</text>

  <!-- Layer 3: Transport -->
  <rect x="110" y="205" width="580" height="215" rx="16" fill="url(#layer3Grad)" stroke="#3B6098" stroke-width="2"/>
  <text x="400" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">TRANSPORT</text>
  <text x="400" y="246" text-anchor="middle" font-size="10" fill="#C5E0F8">TLS 1.2+ / mTLS / Certificate Lifecycle</text>

  <!-- Layer 4: Authentication -->
  <rect x="140" y="262" width="520" height="138" rx="14" fill="url(#layer4Grad)" stroke="#5A8AC8" stroke-width="2"/>
  <text x="400" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">AUTHENTICATION</text>
  <text x="400" y="302" text-anchor="middle" font-size="10" fill="#E0F0FF">OAuth2 / RBAC + ABAC / Per-Tenant IAM</text>

  <!-- Layer 5: Compute -->
  <rect x="170" y="318" width="460" height="62" rx="12" fill="url(#layer5Grad)" stroke="#7BB0E8" stroke-width="2"/>
  <text x="400" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">COMPUTE</text>
  <text x="400" y="358" text-anchor="middle" font-size="10" fill="#2C5282">Namespaces / cgroups v2 / Resource Quotas</text>

  <!-- Layer 6: Zero Trust (Core) - Green for Trust -->
  <rect x="260" y="355" width="280" height="50" rx="10" fill="url(#coreGrad)" stroke="#059669" stroke-width="2"/>
  <!-- Shield Icon -->
  <g transform="translate(285, 363)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <path d="M15 2L3 8v8c0 7 5.1 13.5 12 15 6.9-1.5 12-8 12-15V8L15 2z"/>
    <path d="M10 15l4 4 6-7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="420" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">ZERO TRUST</text>
  <text x="420" y="393" text-anchor="middle" font-size="9" fill="#D1FAE5">Immutable Audit + Continuous Verification</text>

  <!-- Legend -->
  <g transform="translate(50, 485)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1">SECURITY LAYERS (OUTER TO INNER)</text>

    <rect x="0" y="15" width="20" height="20" rx="4" fill="url(#layer1Grad)"/>
    <text x="28" y="30" font-size="10" fill="#4B5563">Perimeter</text>

    <rect x="100" y="15" width="20" height="20" rx="4" fill="url(#layer2Grad)"/>
    <text x="128" y="30" font-size="10" fill="#4B5563">Network</text>

    <rect x="200" y="15" width="20" height="20" rx="4" fill="url(#layer3Grad)"/>
    <text x="228" y="30" font-size="10" fill="#4B5563">Transport</text>

    <rect x="310" y="15" width="20" height="20" rx="4" fill="url(#layer4Grad)"/>
    <text x="338" y="30" font-size="10" fill="#4B5563">Auth</text>

    <rect x="385" y="15" width="20" height="20" rx="4" fill="url(#layer5Grad)"/>
    <text x="413" y="30" font-size="10" fill="#4B5563">Compute</text>

    <rect x="490" y="15" width="20" height="20" rx="4" fill="url(#coreGrad)"/>
    <text x="518" y="30" font-size="10" fill="#4B5563">Zero Trust</text>
  </g>

  <!-- Compliance Box -->
  <g transform="translate(560, 480)">
    <rect width="190" height="50" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
    <text x="95" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">COMPLIANCE ALIGNMENT</text>
    <text x="95" y="38" text-anchor="middle" font-size="9" fill="#047857">NIST 800-53 | ISO 27001 | HIPAA</text>
  </g>

  <!-- Footer -->
  <text x="400" y="565" text-anchor="middle" font-size="9" fill="#9CA3AF">Exhibit 6: Concentric defense-in-depth security model</text>
</svg>
