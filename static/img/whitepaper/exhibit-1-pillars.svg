      <rect x="12" y="5" width="8" height="20" rx="1"/>
      <rect x="22" y="5" width="8" height="20" rx="1"/>
      <line x1="4" y1="10" x2="8" y2="10"/>
      <line x1="14" y1="10" x2="18" y2="10"/>
      <line x1="24" y1="10" x2="28" y2="10"/>
