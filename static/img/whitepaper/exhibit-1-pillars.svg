  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">Seven Operational Pillars</text>
  <text x="550" y="55" text-anchor="middle" font-size="12" fill="#6B7280">Dflare AI Unified Platform — End-to-End GPU Infrastructure Automation</text>

  <!-- Pillar 1: Bare Metal -->
  <g transform="translate(30, 75)">
    <rect width="140" height="210" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <rect width="140" height="50" rx="10" fill="url(#headerGrad)"/>
    <rect y="40" width="140" height="10" fill="url(#headerGrad)"/>
    <!-- Server Icon -->
    <g transform="translate(50, 10)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <rect x="2" y="2" width="26" height="8" rx="2"/>
      <rect x="2" y="14" width="26" height="8" rx="2"/>
      <circle cx="7" cy="6" r="1.5" fill="#FFFFFF"/>
      <circle cx="7" cy="18" r="1.5" fill="#FFFFFF"/>
    </g>
    <text x="70" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0F4C75">Bare Metal</text>
    <text x="70" y="82" text-anchor="middle" font-size="9" fill="#6B7280">Provisioning</text>
    <g fill="#4B5563" font-size="8">
      <text x="70" y="102" text-anchor="middle">PXE Network Boot</text>
      <text x="70" y="118" text-anchor="middle">IPMI / BMC Control</text>
      <text x="70" y="134" text-anchor="middle">Cloud-Init Config</text>
      <text x="70" y="150" text-anchor="middle">Golden OS Images</text>
      <text x="70" y="166" text-anchor="middle">Auto Discovery</text>
    </g>
    <rect x="15" y="182" width="110" height="20" rx="10" fill="#DBEAFE"/>
    <text x="70" y="196" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">AUTOMATION</text>
  </g>

  <!-- Pillar 2: Network -->
