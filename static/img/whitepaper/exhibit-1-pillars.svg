    <rect width="140" height="50" rx="10" fill="url(#headerGrad)"/>
    <rect y="40" width="140" height="10" fill="url(#headerGrad)"/>
    <!-- Storage Icon -->
    <g transform="translate(55, 10)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <ellipse cx="15" cy="6" rx="12" ry="4"/>
      <path d="M3 6v18c0 2.2 5.4 4 12 4s12-1.8 12-4V6"/>
      <path d="M3 14c0 2.2 5.4 4 12 4s12-1.8 12-4"/>
