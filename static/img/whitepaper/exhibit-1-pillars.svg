  <g stroke="#0F4C75" stroke-width="2" stroke-dasharray="4,3" opacity="0.3">
    <line x1="100" y1="285" x2="100" y2="310"/>
    <line x1="250" y1="285" x2="250" y2="310"/>
    <line x1="400" y1="285" x2="400" y2="310"/>
    <line x1="550" y1="285" x2="550" y2="310"/>
    <line x1="700" y1="285" x2="700" y2="310"/>
    <line x1="850" y1="285" x2="850" y2="310"/>
    <line x1="1000" y1="285" x2="1000" y2="310"/>
  </g>

  <!-- Platform Bar -->
  <rect x="30" y="310" width="1040" height="55" rx="10" fill="url(#platformGrad)"/>
  <text x="550" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">DFLARE AI UNIFIED PLATFORM</text>
  <text x="550" y="356" text-anchor="middle" font-size="10" fill="#9CA3AF">Enterprise GPU Infrastructure  |  Single Control Plane  |  Multi-Tenant Isolation</text>

  <!-- Footer -->
  <text x="550" y="388" text-anchor="middle" font-size="9" fill="#9CA3AF">Exhibit 1: Seven operational pillars automated by Dflare AI</text>
</svg>
