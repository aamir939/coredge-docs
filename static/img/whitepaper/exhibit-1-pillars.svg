      <path d="M15 2L3 8v8c0 7 5.1 13.5 12 15 6.9-1.5 12-8 12-15V8L15 2z"/>
      <path d="M10 15l4 4 6-7" stroke-linecap="round" stroke-linejoin="round"/>
