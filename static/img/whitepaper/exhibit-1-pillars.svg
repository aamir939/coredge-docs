      <circle cx="15" cy="15" r="4"/>
      <line x1="15" y1="3" x2="15" y2="11"/>
      <line x1="15" y1="19" x2="15" y2="27"/>
      <line x1="4" y1="9" x2="11" y2="13"/>
      <line x1="19" y1="17" x2="26" y2="21"/>
    </g>
    <text x="70" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0F4C75">Kubernetes</text>
    <text x="70" y="82" text-anchor="middle" font-size="9" fill="#6B7280">Orchestration</text>
    <g fill="#4B5563" font-size="8">
      <text x="70" y="102" text-anchor="middle">GPU Operators</text>
      <text x="70" y="118" text-anchor="middle">CNI Plugins</text>
      <text x="70" y="134" text-anchor="middle">Cluster API</text>
      <text x="70" y="150" text-anchor="middle">Namespaces</text>
