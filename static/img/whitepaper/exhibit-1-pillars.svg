    <rect width="140" height="210" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <rect width="140" height="50" rx="10" fill="url(#headerGrad)"/>
    <rect y="40" width="140" height="10" fill="url(#headerGrad)"/>
    <!-- Network Icon -->
    <g transform="translate(50, 10)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <circle cx="15" cy="5" r="4"/>
      <circle cx="5" cy="25" r="4"/>
      <circle cx="25" cy="25" r="4"/>
      <line x1="15" y1="9" x2="7" y2="21"/>
      <line x1="15" y1="9" x2="23" y2="21"/>
    </g>
    <text x="70" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0F4C75">Network</text>
    <text x="70" y="82" text-anchor="middle" font-size="9" fill="#6B7280">Orchestration</text>
    <g fill="#4B5563" font-size="8">
      <text x="70" y="102" text-anchor="middle">VRF / VLAN Mgmt</text>
      <text x="70" y="118" text-anchor="middle">IB Partition Keys</text>
      <text x="70" y="134" text-anchor="middle">VXLAN / EVPN</text>
      <text x="70" y="150" text-anchor="middle">BGP Peering</text>
      <text x="70" y="166" text-anchor="middle">Firewall ACLs</text>
