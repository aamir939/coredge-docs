  <g transform="translate(930, 75)">
    <rect width="140" height="210" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <rect width="140" height="50" rx="10" fill="url(#headerGrad)"/>
    <rect y="40" width="140" height="10" fill="url(#headerGrad)"/>
    <!-- Chart Icon -->
    <g transform="translate(50, 10)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <rect x="3" y="16" width="6" height="12" rx="1"/>
      <rect x="12" y="10" width="6" height="18" rx="1"/>
      <rect x="21" y="4" width="6" height="24" rx="1"/>
    </g>
    <text x="70" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0F4C75">Billing</text>
    <text x="70" y="82" text-anchor="middle" font-size="9" fill="#6B7280">& Metering</text>
    <g fill="#4B5563" font-size="8">
      <text x="70" y="102" text-anchor="middle">GPU Telemetry</text>
      <text x="70" y="118" text-anchor="middle">Usage Metering</text>
      <text x="70" y="134" text-anchor="middle">Cost Reports</text>
      <text x="70" y="150" text-anchor="middle">Quota Alerts</text>
      <text x="70" y="166" text-anchor="middle">Dashboards</text>
    </g>
