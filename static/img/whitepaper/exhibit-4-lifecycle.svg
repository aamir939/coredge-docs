<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="doneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0F4C75"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="340" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">Automated Bare Metal Provisioning Lifecycle</text>
  <text x="550" y="50" text-anchor="middle" font-size="12" fill="#6B7280">From Request to Production-Ready Node — Fully Automated</text>

  <!-- Step 1: Request -->
  <g transform="translate(35, 75)">
    <circle cx="60" cy="60" r="50" fill="url(#stepGrad)"/>
    <text x="60" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">01</text>
    <!-- Portal Icon -->
    <g transform="translate(45, 55)" stroke="#B0D4F1" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="30" height="20" rx="2"/>
      <line x1="0" y1="7" x2="30" y2="7"/>
      <circle cx="5" cy="3.5" r="1.5" fill="#B0D4F1"/>
    </g>
    <rect y="125" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#0F4C75">Request</text>
    <text x="60" y="166" text-anchor="middle" font-size="9" fill="#6B7280">Tenant selects</text>
    <text x="60" y="180" text-anchor="middle" font-size="9" fill="#6B7280">GPU nodes via portal</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="160" y1="135" x2="200" y2="135" stroke="#0F4C75" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Network -->
  <g transform="translate(210, 75)">
    <circle cx="60" cy="60" r="50" fill="url(#stepGrad)"/>
    <text x="60" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">02</text>
    <!-- Network Icon -->
    <g transform="translate(45, 55)" stroke="#B0D4F1" stroke-width="1.5" fill="none">
      <circle cx="15" cy="5" r="4"/>
      <circle cx="5" cy="22" r="4"/>
      <circle cx="25" cy="22" r="4"/>
      <line x1="15" y1="9" x2="7" y2="18"/>
      <line x1="15" y1="9" x2="23" y2="18"/>
    </g>
    <rect y="125" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#0F4C75">Network</text>
    <text x="60" y="166" text-anchor="middle" font-size="9" fill="#6B7280">Provisions VRFs +</text>
    <text x="60" y="180" text-anchor="middle" font-size="9" fill="#6B7280">VLANs + IB partitions</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="335" y1="135" x2="375" y2="135" stroke="#0F4C75" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Bootstrap -->
  <g transform="translate(385, 75)">
    <circle cx="60" cy="60" r="50" fill="url(#stepGrad)"/>
    <text x="60" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">03</text>
    <!-- Boot Icon -->
    <g transform="translate(45, 55)" stroke="#B0D4F1" stroke-width="1.5" fill="none">
      <rect x="3" y="0" width="24" height="28" rx="2"/>
      <line x1="3" y1="7" x2="27" y2="7"/>
      <circle cx="15" cy="3.5" r="1" fill="#B0D4F1"/>
      <path d="M10 16l5 5 8-8"/>
    </g>
    <rect y="125" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#0F4C75">Bootstrap</text>
    <text x="60" y="166" text-anchor="middle" font-size="9" fill="#6B7280">IPMI power-on |</text>
    <text x="60" y="180" text-anchor="middle" font-size="9" fill="#6B7280">PXE | Golden OS</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="510" y1="135" x2="550" y2="135" stroke="#0F4C75" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Configure -->
  <g transform="translate(560, 75)">
    <circle cx="60" cy="60" r="50" fill="url(#stepGrad)"/>
    <text x="60" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">04</text>
    <!-- Gear Icon -->
    <g transform="translate(45, 55)" stroke="#B0D4F1" stroke-width="1.5" fill="none">
      <circle cx="15" cy="15" r="5"/>
      <path d="M15 5v5M15 25v-5M5 15h5M25 15h-5"/>
      <path d="M8 8l3.5 3.5M22 22l-3.5-3.5M8 22l3.5-3.5M22 8l-3.5 3.5"/>
    </g>
    <rect y="125" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#0F4C75">Configure</text>
    <text x="60" y="166" text-anchor="middle" font-size="9" fill="#6B7280">Cloud-init: hostname,</text>
    <text x="60" y="180" text-anchor="middle" font-size="9" fill="#6B7280">networking, GPU agent</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="685" y1="135" x2="725" y2="135" stroke="#0F4C75" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 5: Storage -->
  <g transform="translate(735, 75)">
    <circle cx="60" cy="60" r="50" fill="url(#stepGrad)"/>
    <text x="60" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">05</text>
    <!-- Storage Icon -->
    <g transform="translate(45, 55)" stroke="#B0D4F1" stroke-width="1.5" fill="none">
      <ellipse cx="15" cy="6" rx="12" ry="4"/>
      <path d="M3 6v18c0 2.2 5.4 4 12 4s12-1.8 12-4V6"/>
      <path d="M3 14c0 2.2 5.4 4 12 4s12-1.8 12-4"/>
    </g>
    <rect y="125" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#0F4C75">Storage</text>
    <text x="60" y="166" text-anchor="middle" font-size="9" fill="#6B7280">Parallel FS directory +</text>
    <text x="60" y="180" text-anchor="middle" font-size="9" fill="#6B7280">ACLs + quotas</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="860" y1="135" x2="900" y2="135" stroke="#0F4C75" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 6: Register (Complete - Green) -->
  <g transform="translate(910, 75)">
    <circle cx="60" cy="60" r="50" fill="url(#doneGrad)"/>
    <text x="60" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">06</text>
    <!-- Check Icon -->
    <g transform="translate(45, 55)" stroke="#D1FAE5" stroke-width="2" fill="none">
      <circle cx="15" cy="14" r="12"/>
      <path d="M9 14l4 4 8-9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect y="125" width="120" height="70" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="60" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">Register</text>
    <text x="60" y="166" text-anchor="middle" font-size="9" fill="#065F46">Agent registers |</text>
    <text x="60" y="180" text-anchor="middle" font-size="9" fill="#065F46">Node ready!</text>
  </g>

  <!-- Progress Bar -->
  <rect x="35" y="285" width="1030" height="12" rx="6" fill="#E5E7EB"/>
  <rect x="35" y="285" width="1030" height="12" rx="6" fill="url(#progressGrad)"/>

  <!-- Footer -->
  <text x="550" y="325" text-anchor="middle" font-size="9" fill="#9CA3AF">Exhibit 4: Automated bare metal provisioning lifecycle — No SSH, No Manual Config, No Tickets</text>
</svg>
