<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="controlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ibGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">Dual-Fabric Network Architecture</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#6B7280">Hardware-Enforced Tenant Isolation</text>

  <!-- Control Plane -->
  <rect x="350" y="75" width="300" height="50" rx="10" fill="url(#controlGrad)"/>
  <g transform="translate(375, 87)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="22" height="16" rx="2"/>
    <line x1="0" y1="6" x2="22" y2="6"/>
    <circle cx="4" cy="3" r="1.5" fill="#FFFFFF"/>
  </g>
  <text x="500" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">CONTROL PLANE</text>

  <!-- Connection Lines from Control Plane -->
  <path d="M425 125 L250 160" stroke="#2563EB" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <path d="M575 125 L750 160" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4" fill="none"/>

  <!-- FRONTEND (Ethernet) Section -->
  <g transform="translate(40, 165)">
    <rect width="420" height="260" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>

    <!-- Header -->
    <rect width="420" height="45" rx="14" fill="url(#ethGrad)"/>
    <rect y="32" width="420" height="13" fill="url(#ethGrad)"/>
    <!-- Ethernet Icon -->
    <g transform="translate(25, 10)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <rect x="0" y="8" width="22" height="10" rx="2"/>
      <line x1="4" y1="3" x2="4" y2="8"/>
      <line x1="11" y1="3" x2="11" y2="8"/>
      <line x1="18" y1="3" x2="18" y2="8"/>
    </g>
    <text x="210" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">FRONTEND (Ethernet)</text>

    <!-- VRF Boxes -->
    <rect x="20" y="60" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="110" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Admin VRF</text>
    <text x="110" y="102" text-anchor="middle" font-size="9" fill="#6B7280">Management Traffic</text>

    <rect x="220" y="60" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="310" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Provisioning VRF</text>
    <text x="310" y="102" text-anchor="middle" font-size="9" fill="#6B7280">PXE / DHCP / TFTP</text>

    <!-- Tenant VRFs -->
    <rect x="20" y="125" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1"/>
    <text x="80" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Tenant VRF 1</text>
    <text x="80" y="164" text-anchor="middle" font-size="8" fill="#6B7280">VLAN Isolated</text>

    <rect x="150" y="125" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1"/>
    <text x="210" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Tenant VRF 2</text>
    <text x="210" y="164" text-anchor="middle" font-size="8" fill="#6B7280">VLAN Isolated</text>

    <rect x="280" y="125" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1"/>
    <text x="340" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">Tenant VRF N</text>
    <text x="340" y="164" text-anchor="middle" font-size="8" fill="#6B7280">VLAN Isolated</text>

    <!-- Underlay -->
    <rect x="20" y="195" width="380" height="45" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
    <text x="210" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">VXLAN / EVPN / BGP Underlay</text>
  </g>

  <!-- BACKEND (InfiniBand) Section -->
  <g transform="translate(540, 165)">
    <rect width="420" height="260" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>

    <!-- Header -->
    <rect width="420" height="45" rx="14" fill="url(#ibGrad)"/>
    <rect y="32" width="420" height="13" fill="url(#ibGrad)"/>
    <!-- IB Icon -->
    <g transform="translate(25, 10)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="22" height="22" rx="2"/>
      <line x1="0" y1="0" x2="22" y2="22"/>
      <line x1="22" y1="0" x2="0" y2="22"/>
      <circle cx="11" cy="11" r="5"/>
    </g>
    <text x="210" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">BACKEND (InfiniBand)</text>

    <!-- IB Components -->
    <rect x="20" y="60" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="110" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">IB Fabric Manager</text>
    <text x="110" y="102" text-anchor="middle" font-size="9" fill="#6B7280">Subnet Manager</text>

    <rect x="220" y="60" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="310" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">PKey Isolation</text>
    <text x="310" y="102" text-anchor="middle" font-size="9" fill="#6B7280">Hardware Enforced</text>

    <!-- GPU/Storage Communication -->
    <rect x="20" y="125" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="110" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">GPU-to-GPU RDMA</text>
    <text x="110" y="164" text-anchor="middle" font-size="8" fill="#6B7280">NVLink / Collective Comms</text>

    <rect x="220" y="125" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="310" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">GPU-to-Storage</text>
    <text x="310" y="164" text-anchor="middle" font-size="8" fill="#6B7280">Parallel FS over IB</text>

    <!-- High-BW Fabric -->
    <rect x="20" y="195" width="380" height="45" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="210" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">High-Bandwidth Multi-Link Fabric (400 Gb/s+)</text>
  </g>

  <!-- Connection Lines to Infrastructure -->
  <path d="M250 425 L250 455" stroke="#2563EB" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <path d="M750 425 L750 455" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4" fill="none"/>

  <!-- Infrastructure Layer -->
  <rect x="40" y="455" width="920" height="95" rx="14" fill="url(#infraGrad)"/>

  <!-- Server Icons -->
  <rect x="70" y="475" width="150" height="55" rx="8" fill="#374151" stroke="#6B7280" stroke-width="1"/>
  <g transform="translate(85, 485)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="18" height="8" rx="1"/>
    <rect x="0" y="12" width="18" height="8" rx="1"/>
    <circle cx="4" cy="4" r="1.5" fill="#FFFFFF"/>
    <circle cx="4" cy="16" r="1.5" fill="#FFFFFF"/>
  </g>
  <text x="155" y="500" font-size="10" font-weight="600" fill="#FFFFFF">GPU Node 1</text>
  <text x="155" y="516" font-size="8" fill="#9CA3AF">Tenant A</text>

  <rect x="235" y="475" width="150" height="55" rx="8" fill="#374151" stroke="#6B7280" stroke-width="1"/>
  <g transform="translate(250, 485)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="18" height="8" rx="1"/>
    <rect x="0" y="12" width="18" height="8" rx="1"/>
    <circle cx="4" cy="4" r="1.5" fill="#FFFFFF"/>
    <circle cx="4" cy="16" r="1.5" fill="#FFFFFF"/>
  </g>
  <text x="320" y="500" font-size="10" font-weight="600" fill="#FFFFFF">GPU Node 2</text>
  <text x="320" y="516" font-size="8" fill="#9CA3AF">Tenant A</text>

  <rect x="400" y="475" width="150" height="55" rx="8" fill="#374151" stroke="#6B7280" stroke-width="1"/>
  <g transform="translate(415, 485)" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="18" height="8" rx="1"/>
    <rect x="0" y="12" width="18" height="8" rx="1"/>
    <circle cx="4" cy="4" r="1.5" fill="#FFFFFF"/>
    <circle cx="4" cy="16" r="1.5" fill="#FFFFFF"/>
  </g>
  <text x="485" y="500" font-size="10" font-weight="600" fill="#FFFFFF">GPU Node N</text>
  <text x="485" y="516" font-size="8" fill="#9CA3AF">Tenant B</text>

  <rect x="620" y="475" width="150" height="55" rx="8" fill="#374151" stroke="#10B981" stroke-width="1.5"/>
  <g transform="translate(635, 483)" stroke="#10B981" stroke-width="1.5" fill="none">
    <ellipse cx="10" cy="5" rx="8" ry="3"/>
    <path d="M2 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
    <path d="M2 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="705" y="500" font-size="10" font-weight="600" fill="#10B981">Parallel FS</text>
  <text x="705" y="516" font-size="8" fill="#9CA3AF">Storage T1</text>

  <rect x="785" y="475" width="150" height="55" rx="8" fill="#374151" stroke="#10B981" stroke-width="1.5"/>
  <g transform="translate(800, 483)" stroke="#10B981" stroke-width="1.5" fill="none">
    <ellipse cx="10" cy="5" rx="8" ry="3"/>
    <path d="M2 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
    <path d="M2 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="870" y="500" font-size="10" font-weight="600" fill="#10B981">Object Store</text>
  <text x="870" y="516" font-size="8" fill="#9CA3AF">Storage T2</text>

  <!-- Footer -->
  <text x="500" y="572" text-anchor="middle" font-size="9" fill="#9CA3AF">Exhibit 3: Dual-fabric network architecture with hardware-enforced tenant isolation</text>
</svg>
