<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="controlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C75"/>
      <stop offset="100%" stop-color="#1B6FA0"/>
    </linearGradient>
    <linearGradient id="computeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">Platform Architecture</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#6B7280">Layered Architecture — From Control Plane to Infrastructure</text>

  <!-- Layer 1: Control Plane -->
  <g transform="translate(50, 75)">
    <rect width="800" height="85" rx="12" fill="url(#controlGrad)"/>
    <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">CONTROL PLANE</text>

    <!-- Portal -->
    <rect x="30" y="38" width="140" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(45, 45)" stroke="#0F4C75" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="20" height="14" rx="2"/>
      <line x1="0" y1="5" x2="20" y2="5"/>
    </g>
    <text x="100" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">Web Portal</text>

    <!-- API Gateway -->
    <rect x="190" y="38" width="140" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(205, 45)" stroke="#0F4C75" stroke-width="1.5" fill="none">
      <rect x="0" y="2" width="20" height="16" rx="2"/>
      <line x1="5" y1="7" x2="15" y2="7"/>
      <line x1="5" y1="12" x2="12" y2="12"/>
    </g>
    <text x="260" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">API Gateway</text>

    <!-- IAM -->
    <rect x="350" y="38" width="140" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(365, 45)" stroke="#0F4C75" stroke-width="1.5" fill="none">
      <circle cx="10" cy="6" r="4"/>
      <path d="M3 18c0-4 3-6 7-6s7 2 7 6"/>
    </g>
    <text x="420" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">IAM Service</text>

    <!-- Workflow -->
    <rect x="510" y="38" width="140" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(525, 45)" stroke="#0F4C75" stroke-width="1.5" fill="none">
      <circle cx="3" cy="10" r="3"/>
      <circle cx="17" cy="10" r="3"/>
      <line x1="6" y1="10" x2="14" y2="10"/>
      <path d="M12 7l3 3-3 3"/>
    </g>
    <text x="580" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">Workflow Engine</text>

    <!-- Observability -->
    <rect x="670" y="38" width="100" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(685, 45)" stroke="#0F4C75" stroke-width="1.5" fill="none">
      <rect x="0" y="10" width="5" height="8" rx="1"/>
      <rect x="7" y="6" width="5" height="12" rx="1"/>
      <rect x="14" y="2" width="5" height="16" rx="1"/>
    </g>
    <text x="720" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">Metrics</text>
  </g>

  <!-- Layer 2: Compute Orchestration -->
  <g transform="translate(50, 175)">
    <rect width="800" height="85" rx="12" fill="url(#computeGrad)"/>
    <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">COMPUTE ORCHESTRATION</text>

    <!-- Kubernetes -->
    <rect x="80" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(95, 45)" stroke="#059669" stroke-width="1.5" fill="none">
      <circle cx="10" cy="10" r="8"/>
      <circle cx="10" cy="10" r="3"/>
      <line x1="10" y1="2" x2="10" y2="7"/>
      <line x1="10" y1="13" x2="10" y2="18"/>
    </g>
    <text x="170" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Kubernetes + GPU Operator</text>

    <!-- Slurm -->
    <rect x="310" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(325, 45)" stroke="#059669" stroke-width="1.5" fill="none">
      <rect x="0" y="2" width="6" height="16" rx="1"/>
      <rect x="8" y="2" width="6" height="16" rx="1"/>
      <rect x="16" y="2" width="6" height="16" rx="1"/>
    </g>
    <text x="400" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Slurm HPC Scheduler</text>

    <!-- Resource Manager -->
    <rect x="540" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(555, 45)" stroke="#059669" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="18" height="18" rx="2"/>
      <line x1="6" y1="0" x2="6" y2="18"/>
      <line x1="12" y1="0" x2="12" y2="18"/>
      <line x1="0" y1="9" x2="18" y2="9"/>
    </g>
    <text x="630" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Resource Manager</text>
  </g>

  <!-- Layer 3: Network -->
  <g transform="translate(50, 275)">
    <rect width="800" height="85" rx="12" fill="url(#networkGrad)"/>
    <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">NETWORK FABRIC</text>

    <!-- Ethernet -->
    <rect x="80" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(95, 45)" stroke="#D97706" stroke-width="1.5" fill="none">
      <rect x="0" y="5" width="20" height="10" rx="2"/>
      <line x1="4" y1="0" x2="4" y2="5"/>
      <line x1="10" y1="0" x2="10" y2="5"/>
      <line x1="16" y1="0" x2="16" y2="5"/>
    </g>
    <text x="170" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#D97706">Ethernet VRF/VLAN</text>

    <!-- InfiniBand -->
    <rect x="310" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(325, 45)" stroke="#D97706" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="18" height="18" rx="2"/>
      <line x1="0" y1="0" x2="18" y2="18"/>
      <line x1="18" y1="0" x2="0" y2="18"/>
      <circle cx="9" cy="9" r="4"/>
    </g>
    <text x="400" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#D97706">InfiniBand PKey</text>

    <!-- Firewall -->
    <rect x="540" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(555, 45)" stroke="#D97706" stroke-width="1.5" fill="none">
      <path d="M10 0L0 5v7c0 5 4 9 10 10 6-1 10-5 10-10V5L10 0z"/>
    </g>
    <text x="630" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#D97706">Firewall / ACLs</text>
  </g>

  <!-- Layer 4: Storage -->
  <g transform="translate(50, 375)">
    <rect width="800" height="85" rx="12" fill="url(#storageGrad)"/>
    <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">STORAGE LAYER</text>

    <!-- Parallel FS -->
    <rect x="80" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(95, 43)" stroke="#7C3AED" stroke-width="1.5" fill="none">
      <ellipse cx="10" cy="4" rx="8" ry="3"/>
      <path d="M2 4v10c0 1.7 3.6 3 8 3s8-1.3 8-3V4"/>
    </g>
    <text x="170" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#7C3AED">Parallel FS (IB)</text>

    <!-- Object Storage -->
    <rect x="310" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(325, 45)" stroke="#7C3AED" stroke-width="1.5" fill="none">
      <rect x="0" y="4" width="8" height="12" rx="1"/>
      <rect x="10" y="4" width="8" height="12" rx="1"/>
      <line x1="4" y1="0" x2="4" y2="4"/>
      <line x1="14" y1="0" x2="14" y2="4"/>
    </g>
    <text x="400" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#7C3AED">Object Storage (S3)</text>

    <!-- Quota Manager -->
    <rect x="540" y="38" width="180" height="38" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <g transform="translate(555, 45)" stroke="#7C3AED" stroke-width="1.5" fill="none">
      <circle cx="10" cy="10" r="8"/>
      <path d="M10 10L10 4"/>
      <path d="M10 10L15 12"/>
    </g>
    <text x="630" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#7C3AED">Quota Manager</text>
  </g>

  <!-- Layer 5: Infrastructure -->
  <g transform="translate(50, 475)">
    <rect width="800" height="50" rx="12" fill="url(#infraGrad)"/>
    <text x="400" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">HARDWARE INFRASTRUCTURE — GPU Nodes | InfiniBand Switches | Storage Arrays</text>
  </g>

  <!-- Footer -->
  <text x="450" y="545" text-anchor="middle" font-size="9" fill="#9CA3AF">Exhibit 2: Platform architecture — from control plane to infrastructure</text>
</svg>
