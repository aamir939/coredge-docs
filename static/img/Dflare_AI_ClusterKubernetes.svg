<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="#FAFBFC"/>

  <!-- Main Container -->
  <rect x="20" y="15" width="760" height="440" rx="12" fill="#F0F7FF" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="20" y="15" width="760" height="45" rx="12" fill="#0F4C75"/>
  <rect x="20" y="45" width="760" height="15" fill="#0F4C75"/>
  <text x="400" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Kubernetes Cluster Orchestration</text>

  <!-- User Config -->
  <rect x="40" y="75" width="720" height="50" rx="8" fill="#FFFFFF" stroke="#3498DB" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#0F4C75">User Configuration (Portal)</text>
  <text x="400" y="112" text-anchor="middle" font-size="9" fill="#4B5563">K8s Version  •  CNI Plugin (BGP / eBPF)  •  Node Pools  •  Host Flavors  •  Labels &amp; Taints</text>

  <!-- Control Plane -->
  <rect x="40" y="140" width="350" height="115" rx="8" fill="#FFFFFF" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="140" width="350" height="24" rx="8" fill="#0F4C75"/>
  <rect x="40" y="156" width="350" height="8" fill="#0F4C75"/>
  <text x="215" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Control Plane (HA)</text>
  <text x="55" y="182" font-size="9" fill="#4B5563">• API Server (static pod)</text>
  <text x="55" y="196" font-size="9" fill="#4B5563">• etcd (3 or 5 node quorum)</text>
  <text x="55" y="210" font-size="9" fill="#4B5563">• Controller Manager</text>
  <text x="55" y="224" font-size="9" fill="#4B5563">• Scheduler</text>
  <text x="55" y="238" font-size="9" fill="#4B5563">• CNI Plugin (pod networking)</text>

  <!-- GPU Workers -->
  <rect x="410" y="140" width="350" height="115" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="140" width="350" height="24" rx="8" fill="#27AE60"/>
  <rect x="410" y="156" width="350" height="8" fill="#27AE60"/>
  <text x="585" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">GPU Worker Nodes</text>
  <text x="425" y="182" font-size="9" fill="#4B5563">• Container Runtime (OCI)</text>
  <text x="425" y="196" font-size="9" fill="#4B5563">• GPU Device Plugin (DaemonSet)</text>
  <text x="425" y="210" font-size="9" fill="#4B5563">• GPU Telemetry Exporter</text>
  <text x="425" y="224" font-size="9" fill="#4B5563">• GPU Feature Discovery</text>
  <text x="425" y="238" font-size="9" fill="#4B5563">• Multi-vendor GPU operators</text>

  <!-- Lifecycle Ops -->
  <text x="48" y="275" font-size="9" font-weight="700" fill="#9CA3AF" letter-spacing="1.2">LIFECYCLE OPERATIONS</text>

  <rect x="40" y="285" width="170" height="30" rx="6" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1"/>
  <text x="125" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#0F4C75">Upscale</text>

  <rect x="225" y="285" width="170" height="30" rx="6" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1"/>
  <text x="310" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#0F4C75">Downscale</text>

  <rect x="410" y="285" width="170" height="30" rx="6" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1"/>
  <text x="495" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#0F4C75">Rolling Upgrade</text>

  <rect x="595" y="285" width="165" height="30" rx="6" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1"/>
  <text x="677" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#C0392B">Delete</text>

  <!-- Key Capabilities -->
  <text x="48" y="340" font-size="9" font-weight="700" fill="#9CA3AF" letter-spacing="1.2">KEY CAPABILITIES</text>

  <rect x="40" y="350" width="720" height="60" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="55" y="370" font-size="9" fill="#4B5563">✓ Air-gapped: all images from internal registry</text>
  <text x="55" y="386" font-size="9" fill="#4B5563">✓ Conformance checks: API server, nodes, CNI, DNS, GPUs</text>
  <text x="400" y="370" font-size="9" fill="#4B5563">✓ Zero-downtime rolling upgrades</text>
  <text x="400" y="386" font-size="9" fill="#4B5563">✓ Multi-vendor GPU support</text>

  <!-- Workloads -->
  <rect x="40" y="420" width="720" height="28" rx="6" fill="#E8F8F5" stroke="#27AE60" stroke-width="1"/>
  <text x="400" y="439" text-anchor="middle" font-size="10" font-weight="600" fill="#1E8449">Workloads: AI Training  •  Inference  •  MLOps Pipelines  •  Model Serving</text>

  <!-- Footer -->
  <text x="400" y="470" text-anchor="middle" font-size="8" fill="#9CA3AF">Dflare AI • Kubernetes Cluster</text>
</svg>
