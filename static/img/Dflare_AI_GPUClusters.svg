<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1400" height="700" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">GPU Clusters — Kubernetes &amp; Slurm (HPC) on Shared Infrastructure</text>
  <text x="700" y="58" text-anchor="middle" font-size="12" fill="#6B7280">Unified compute orchestration: both container-native and HPC workloads on the same bare metal nodes</text>

  <!-- ==================== LEFT: KUBERNETES ==================== -->
  <rect x="60" y="80" width="620" height="560" rx="12" fill="#F0F7FF" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- K8s Header -->
  <rect x="60" y="80" width="620" height="50" rx="12" fill="#0F4C75"/>
  <rect x="60" y="110" width="620" height="20" fill="#0F4C75"/>
  <text x="370" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">☸️  Kubernetes Cluster Orchestration</text>

  <!-- User Config -->
  <rect x="80" y="145" width="580" height="65" rx="8" fill="#FFFFFF" stroke="#3498DB" stroke-width="1" filter="url(#shadow)"/>
  <text x="370" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#0F4C75">User Configuration (Portal)</text>
  <text x="370" y="190" text-anchor="middle" font-size="10" fill="#4B5563">K8s Version  •  CNI Plugin (BGP / eBPF)  •  Node Pools  •  Host Flavors  •  Labels &amp; Taints</text>

  <!-- Control Plane -->
  <rect x="80" y="225" width="280" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C75" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="225" width="280" height="26" rx="8" fill="#0F4C75"/>
  <rect x="80" y="243" width="280" height="8" fill="#0F4C75"/>
  <text x="220" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Control Plane (HA)</text>
  <text x="95" y="275" font-size="10" fill="#4B5563">• API Server (static pod)</text>
  <text x="95" y="292" font-size="10" fill="#4B5563">• etcd (3 or 5 node quorum)</text>
  <text x="95" y="309" font-size="10" fill="#4B5563">• Controller Manager</text>
  <text x="95" y="326" font-size="10" fill="#4B5563">• Scheduler</text>
  <text x="95" y="343" font-size="10" fill="#4B5563">• CNI Plugin (pod networking)</text>

  <!-- GPU Workers -->
  <rect x="380" y="225" width="280" height="130" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="380" y="225" width="280" height="26" rx="8" fill="#27AE60"/>
  <rect x="380" y="243" width="280" height="8" fill="#27AE60"/>
  <text x="520" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">GPU Worker Nodes</text>
  <text x="395" y="275" font-size="10" fill="#4B5563">• Container Runtime (OCI)</text>
  <text x="395" y="292" font-size="10" fill="#4B5563">• GPU Device Plugin (DaemonSet)</text>
  <text x="395" y="309" font-size="10" fill="#4B5563">• GPU Telemetry Exporter</text>
  <text x="395" y="326" font-size="10" fill="#4B5563">• GPU Feature Discovery</text>
  <text x="395" y="343" font-size="10" fill="#4B5563">• Multi-vendor GPU operators</text>

  <!-- Lifecycle Ops -->
  <text x="88" y="375" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">LIFECYCLE OPERATIONS</text>

  <rect x="80" y="390" width="130" height="35" rx="6" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1"/>
  <text x="145" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">⬆️ Upscale</text>

  <rect x="225" y="390" width="130" height="35" rx="6" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1"/>
  <text x="290" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">⬇️ Downscale</text>

  <rect x="370" y="390" width="145" height="35" rx="6" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1"/>
  <text x="442" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#0F4C75">🔄 Rolling Upgrade</text>

  <rect x="530" y="390" width="130" height="35" rx="6" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1"/>
  <text x="595" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#C0392B">🗑️ Delete</text>

  <!-- K8s Features -->
  <text x="88" y="450" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">KEY CAPABILITIES</text>

  <rect x="80" y="462" width="580" height="80" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="95" y="484" font-size="10" fill="#4B5563">✓ Air-gapped: all images from internal registry</text>
  <text x="95" y="501" font-size="10" fill="#4B5563">✓ Conformance checks: API server, nodes, CNI, DNS, GPUs</text>
  <text x="95" y="518" font-size="10" fill="#4B5563">✓ Zero-downtime rolling upgrades</text>
  <text x="95" y="535" font-size="10" fill="#4B5563">✓ Multi-vendor GPU: NVIDIA, AMD, Intel operators</text>

  <!-- Workload Types K8s -->
  <rect x="80" y="555" width="580" height="40" rx="8" fill="#E8F8F5" stroke="#27AE60" stroke-width="1"/>
  <text x="370" y="580" text-anchor="middle" font-size="11" font-weight="600" fill="#1E8449">Workloads: AI Training  •  Inference  •  MLOps Pipelines  •  Model Serving</text>

  <!-- ==================== RIGHT: SLURM ==================== -->
  <rect x="720" y="80" width="620" height="560" rx="12" fill="#FEF9F0" stroke="#E67E22" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Slurm Header -->
  <rect x="720" y="80" width="620" height="50" rx="12" fill="#E67E22"/>
  <rect x="720" y="110" width="620" height="20" fill="#E67E22"/>
  <text x="1030" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">🖥️  Slurm (HPC) Cluster Orchestration</text>

  <!-- Slurm on K8s -->
  <rect x="740" y="145" width="580" height="65" rx="8" fill="#FFFFFF" stroke="#D35400" stroke-width="1" filter="url(#shadow)"/>
  <text x="1030" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#D35400">Slurm on Kubernetes (via Operator)</text>
  <text x="1030" y="190" text-anchor="middle" font-size="10" fill="#4B5563">K8s cluster deployed first → Slurm layered as Kubernetes-native objects → ConfigMaps auto-generated</text>

  <!-- Slurm Controller -->
  <rect x="740" y="225" width="280" height="130" rx="8" fill="#FFFFFF" stroke="#E67E22" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="740" y="225" width="280" height="26" rx="8" fill="#E67E22"/>
  <rect x="740" y="243" width="280" height="8" fill="#E67E22"/>
  <text x="880" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Slurm Controller Daemons</text>
  <text x="755" y="275" font-size="10" fill="#4B5563">• slurmctld (controller)</text>
  <text x="755" y="292" font-size="10" fill="#4B5563">• slurmdbd (accounting DB)</text>
  <text x="755" y="309" font-size="10" fill="#4B5563">• slurmrestd (REST API)</text>
  <text x="755" y="326" font-size="10" fill="#4B5563">• MUNGE (authentication)</text>
  <text x="755" y="343" font-size="10" fill="#4B5563">• Relational DB (StatefulSet)</text>

  <!-- Slurm Compute -->
  <rect x="1040" y="225" width="280" height="130" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1040" y="225" width="280" height="26" rx="8" fill="#27AE60"/>
  <rect x="1040" y="243" width="280" height="8" fill="#27AE60"/>
  <text x="1180" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">GPU Compute Nodes</text>
  <text x="1055" y="275" font-size="10" fill="#4B5563">• slurmd (per GPU node)</text>
  <text x="1055" y="292" font-size="10" fill="#4B5563">• GRES plugin (GPU topology)</text>
  <text x="1055" y="309" font-size="10" fill="#4B5563">• cgroups v2 isolation</text>
  <text x="1055" y="326" font-size="10" fill="#4B5563">• NUMA affinity awareness</text>
  <text x="1055" y="343" font-size="10" fill="#4B5563">• Multi-GPU job placement</text>

  <!-- Scheduling -->
  <text x="748" y="375" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">SCHEDULING &amp; JOB MANAGEMENT</text>

  <rect x="740" y="390" width="145" height="35" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="812" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#D35400">📄 sbatch</text>

  <rect x="900" y="390" width="145" height="35" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="972" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#D35400">📋 squeue</text>

  <rect x="1060" y="390" width="115" height="35" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="1117" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#D35400">▶️ srun</text>

  <rect x="1190" y="390" width="130" height="35" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="1255" y="412" text-anchor="middle" font-size="10" font-weight="600" fill="#D35400">🔌 REST API</text>

  <!-- Slurm Features -->
  <text x="748" y="450" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">KEY CAPABILITIES</text>

  <rect x="740" y="462" width="580" height="80" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="755" y="484" font-size="10" fill="#4B5563">✓ GPU-aware scheduling: --gres=gpu:&lt;type&gt;:&lt;count&gt;</text>
  <text x="755" y="501" font-size="10" fill="#4B5563">✓ Fair-share scheduling: equitable access across tenants</text>
  <text x="755" y="518" font-size="10" fill="#4B5563">✓ Full job accounting: GPU-hrs, CPU-hrs, memory → billing pipeline</text>
  <text x="755" y="535" font-size="10" fill="#4B5563">✓ cgroups v2 job isolation: no resource leakage between jobs</text>

  <!-- Workload Types Slurm -->
  <rect x="740" y="555" width="580" height="40" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="1030" y="580" text-anchor="middle" font-size="11" font-weight="600" fill="#D35400">Workloads: AI Training  •  Fine-Tuning  •  HPC Simulation  •  Batch Jobs</text>

  <!-- ==================== BOTTOM: SHARED INFRASTRUCTURE ==================== -->
  <rect x="60" y="650" width="1280" height="40" rx="8" fill="#1A1A2E" filter="url(#shadow)"/>
  <text x="700" y="675" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">🔗 Shared Infrastructure:  Same Bare Metal Nodes  •  Same InfiniBand  •  Same Storage  •  Same Monitoring  •  Same Billing</text>

  <!-- Footer -->
  <text x="700" y="712" text-anchor="middle" font-size="10" fill="#9CA3AF">© Dflare AI  •  GPU Clusters: Kubernetes &amp; Slurm  •  Confidential</text>
</svg>
