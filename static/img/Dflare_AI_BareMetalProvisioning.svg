<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0F4C75"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E67E22"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27AE60"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A2E">Bare Metal Provisioning — Automated Workflow</text>
  <text x="400" y="42" text-anchor="middle" font-size="9" fill="#6B7280">From powered-off GPU server to workload-ready node — fully automated</text>

  <!-- ROW 1: Steps 1-5 -->
  <rect x="20" y="58" width="145" height="70" rx="8" fill="#0F4C75" filter="url(#shadow)"/>
  <text x="92" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#B0D4F1">STEP 1</text>
  <text x="92" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Tenant Request</text>
  <text x="92" y="112" text-anchor="middle" font-size="8" fill="#B0D4F1">Portal UI / API</text>

  <line x1="165" y1="93" x2="175" y2="93" stroke="#0F4C75" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="180" y="58" width="115" height="70" rx="8" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1" filter="url(#shadow)"/>
  <text x="237" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#0F4C75">STEP 2</text>
  <text x="237" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#0F4C75">Network Prep</text>
  <text x="237" y="112" text-anchor="middle" font-size="8" fill="#4B5563">VRF + VLANs</text>

  <line x1="295" y1="93" x2="305" y2="93" stroke="#0F4C75" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="310" y="58" width="115" height="70" rx="8" fill="#E8F4FD" stroke="#0F4C75" stroke-width="1" filter="url(#shadow)"/>
  <text x="367" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#0F4C75">STEP 3</text>
  <text x="367" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#0F4C75">IPMI Power On</text>
  <text x="367" y="112" text-anchor="middle" font-size="8" fill="#4B5563">BMC command</text>

  <line x1="425" y1="93" x2="435" y2="93" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrO)"/>

  <rect x="440" y="58" width="115" height="70" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1" filter="url(#shadow)"/>
  <text x="497" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#D35400">STEP 4</text>
  <text x="497" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#D35400">PXE Boot</text>
  <text x="497" y="112" text-anchor="middle" font-size="8" fill="#7B5B3A">DHCP → TFTP</text>

  <line x1="555" y1="93" x2="565" y2="93" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrO)"/>

  <rect x="570" y="58" width="115" height="70" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1" filter="url(#shadow)"/>
  <text x="627" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#D35400">STEP 5</text>
  <text x="627" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#D35400">Golden OS</text>
  <text x="627" y="112" text-anchor="middle" font-size="8" fill="#7B5B3A">Tuned image</text>

  <line x1="685" y1="93" x2="695" y2="93" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrO)"/>

  <rect x="700" y="58" width="80" height="70" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1" filter="url(#shadow)"/>
  <text x="740" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#D35400">STEP 6</text>
  <text x="740" y="96" text-anchor="middle" font-size="8" font-weight="700" fill="#D35400">Cloud-Init</text>
  <text x="740" y="112" text-anchor="middle" font-size="7" fill="#7B5B3A">Agent deploy</text>

  <!-- Arrow down to ROW 2 -->
  <path d="M 740 128 L 740 145 L 620 145 L 620 155" fill="none" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- ROW 2: Steps 7-9 -->
  <rect x="530" y="160" width="170" height="65" rx="8" fill="#E8F8F5" stroke="#27AE60" stroke-width="1" filter="url(#shadow)"/>
  <text x="615" y="182" text-anchor="middle" font-size="9" font-weight="700" fill="#1E8449">STEP 7 — Storage Provision</text>
  <text x="615" y="198" text-anchor="middle" font-size="8" fill="#4B5563">Tenant directory + IB access control</text>
  <text x="615" y="212" text-anchor="middle" font-size="8" fill="#4B5563">map on parallel filesystem</text>

  <line x1="530" y1="192" x2="520" y2="192" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrG)"/>

  <rect x="340" y="160" width="170" height="65" rx="8" fill="#E8F8F5" stroke="#27AE60" stroke-width="1" filter="url(#shadow)"/>
  <text x="425" y="182" text-anchor="middle" font-size="9" font-weight="700" fill="#1E8449">STEP 8 — Agent Registration</text>
  <text x="425" y="198" text-anchor="middle" font-size="8" fill="#4B5563">GPU agent connects to portal</text>
  <text x="425" y="212" text-anchor="middle" font-size="8" fill="#4B5563">via gRPC (bidirectional)</text>

  <line x1="340" y1="192" x2="330" y2="192" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrG)"/>

  <rect x="150" y="160" width="170" height="65" rx="8" fill="#27AE60" filter="url(#shadow)"/>
  <text x="235" y="182" text-anchor="middle" font-size="9" font-weight="700" fill="#A9DFBF">STEP 9</text>
  <text x="235" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓ Node Ready</text>
  <text x="235" y="215" text-anchor="middle" font-size="8" fill="#D5F5E3">Available for cluster assignment</text>

  <!-- DEALLOCATION FLOW -->
  <text x="28" y="250" font-size="8" font-weight="700" fill="#9CA3AF" letter-spacing="1">DEALLOCATION FLOW</text>

  <rect x="20" y="260" width="760" height="35" rx="6" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1"/>
  <rect x="30" y="268" width="120" height="20" rx="4" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="90" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#C0392B">Workload Drain</text>
  <text x="160" y="282" font-size="8" fill="#C0392B">→</text>
  <rect x="175" y="268" width="120" height="20" rx="4" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="235" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#C0392B">Cluster Removal</text>
  <text x="305" y="282" font-size="8" fill="#C0392B">→</text>
  <rect x="320" y="268" width="120" height="20" rx="4" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="380" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#C0392B">Network Cleanup</text>
  <text x="450" y="282" font-size="8" fill="#C0392B">→</text>
  <rect x="465" y="268" width="120" height="20" rx="4" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="525" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#C0392B">Storage Cleanup</text>
  <text x="595" y="282" font-size="8" fill="#C0392B">→</text>
  <rect x="610" y="268" width="160" height="20" rx="4" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
  <text x="690" y="282" text-anchor="middle" font-size="8" font-weight="600" fill="#C0392B">Return to Pool</text>

  <!-- GOLDEN OS IMAGE DETAILS -->
  <text x="28" y="320" font-size="8" font-weight="700" fill="#9CA3AF" letter-spacing="1">GOLDEN OS IMAGE — PERFORMANCE TUNING</text>

  <rect x="20" y="330" width="185" height="70" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="112" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#1F2937">BIOS Settings</text>
  <text x="30" y="368" font-size="8" fill="#6B7280">• Performance profile</text>
  <text x="30" y="382" font-size="8" fill="#6B7280">• C-states disabled, NUMA aligned</text>
  <text x="30" y="396" font-size="8" fill="#6B7280">• PCIe ASPM off, virtualization off</text>

  <rect x="215" y="330" width="185" height="70" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="307" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#1F2937">OS Settings</text>
  <text x="225" y="368" font-size="8" fill="#6B7280">• CPU governor: performance</text>
  <text x="225" y="382" font-size="8" fill="#6B7280">• Huge pages enabled</text>
  <text x="225" y="396" font-size="8" fill="#6B7280">• NUMA balancing disabled</text>

  <rect x="410" y="330" width="185" height="70" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="502" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#1F2937">GPU Agent</text>
  <text x="420" y="368" font-size="8" fill="#6B7280">• Lightweight gRPC agent</text>
  <text x="420" y="382" font-size="8" fill="#6B7280">• Bidirectional comms</text>
  <text x="420" y="396" font-size="8" fill="#6B7280">• Secure portal connection</text>

  <rect x="605" y="330" width="175" height="70" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="692" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#1F2937">Multi-Vendor HW</text>
  <text x="615" y="368" font-size="8" fill="#6B7280">• NVIDIA, AMD, Intel GPUs</text>
  <text x="615" y="382" font-size="8" fill="#6B7280">• Configurable profiles</text>
  <text x="615" y="396" font-size="8" fill="#6B7280">• Scalable to 1000s nodes</text>

  <!-- Footer -->
  <text x="400" y="470" text-anchor="middle" font-size="8" fill="#9CA3AF">Dflare AI • Bare Metal Provisioning Flow</text>
</svg>
