<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="#FAFBFC"/>

  <!-- Main Container -->
  <rect x="20" y="15" width="760" height="440" rx="12" fill="#FEF9F0" stroke="#E67E22" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="20" y="15" width="760" height="45" rx="12" fill="#E67E22"/>
  <rect x="20" y="45" width="760" height="15" fill="#E67E22"/>
  <text x="400" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Slurm (HPC) Cluster Orchestration</text>

  <!-- Slurm on K8s -->
  <rect x="40" y="75" width="720" height="50" rx="8" fill="#FFFFFF" stroke="#D35400" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#D35400">Slurm on Kubernetes (via Operator)</text>
  <text x="400" y="112" text-anchor="middle" font-size="9" fill="#4B5563">K8s cluster deployed first → Slurm layered as Kubernetes-native objects → ConfigMaps auto-generated</text>

  <!-- Slurm Controller -->
  <rect x="40" y="140" width="350" height="115" rx="8" fill="#FFFFFF" stroke="#E67E22" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="140" width="350" height="24" rx="8" fill="#E67E22"/>
  <rect x="40" y="156" width="350" height="8" fill="#E67E22"/>
  <text x="215" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Slurm Controller Daemons</text>
  <text x="55" y="182" font-size="9" fill="#4B5563">• slurmctld (controller)</text>
  <text x="55" y="196" font-size="9" fill="#4B5563">• slurmdbd (accounting DB)</text>
  <text x="55" y="210" font-size="9" fill="#4B5563">• slurmrestd (REST API)</text>
  <text x="55" y="224" font-size="9" fill="#4B5563">• MUNGE (authentication)</text>
  <text x="55" y="238" font-size="9" fill="#4B5563">• Relational DB (StatefulSet)</text>

  <!-- GPU Compute -->
  <rect x="410" y="140" width="350" height="115" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="140" width="350" height="24" rx="8" fill="#27AE60"/>
  <rect x="410" y="156" width="350" height="8" fill="#27AE60"/>
  <text x="585" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">GPU Compute Nodes</text>
  <text x="425" y="182" font-size="9" fill="#4B5563">• slurmd (per GPU node)</text>
  <text x="425" y="196" font-size="9" fill="#4B5563">• GRES plugin (GPU topology)</text>
  <text x="425" y="210" font-size="9" fill="#4B5563">• cgroups v2 isolation</text>
  <text x="425" y="224" font-size="9" fill="#4B5563">• NUMA affinity awareness</text>
  <text x="425" y="238" font-size="9" fill="#4B5563">• Multi-GPU job placement</text>

  <!-- Job Management -->
  <text x="48" y="275" font-size="9" font-weight="700" fill="#9CA3AF" letter-spacing="1.2">JOB SUBMISSION</text>

  <rect x="40" y="285" width="170" height="30" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="125" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#D35400">sbatch</text>

  <rect x="225" y="285" width="170" height="30" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="310" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#D35400">squeue</text>

  <rect x="410" y="285" width="170" height="30" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="495" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#D35400">srun</text>

  <rect x="595" y="285" width="165" height="30" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="677" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#D35400">REST API</text>

  <!-- Key Capabilities -->
  <text x="48" y="340" font-size="9" font-weight="700" fill="#9CA3AF" letter-spacing="1.2">KEY CAPABILITIES</text>

  <rect x="40" y="350" width="720" height="60" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="55" y="370" font-size="9" fill="#4B5563">✓ GPU-aware scheduling: --gres=gpu:&lt;type&gt;:&lt;count&gt;</text>
  <text x="55" y="386" font-size="9" fill="#4B5563">✓ Fair-share scheduling: equitable access across tenants</text>
  <text x="400" y="370" font-size="9" fill="#4B5563">✓ Full job accounting → billing pipeline</text>
  <text x="400" y="386" font-size="9" fill="#4B5563">✓ cgroups v2 job isolation</text>

  <!-- Workloads -->
  <rect x="40" y="420" width="720" height="28" rx="6" fill="#FDF2E9" stroke="#E67E22" stroke-width="1"/>
  <text x="400" y="439" text-anchor="middle" font-size="10" font-weight="600" fill="#D35400">Workloads: AI Training  •  Fine-Tuning  •  HPC Simulation  •  Batch Jobs</text>

  <!-- Footer -->
  <text x="400" y="470" text-anchor="middle" font-size="8" fill="#9CA3AF">Dflare AI • Slurm HPC Cluster</text>
</svg>
